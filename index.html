<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-overflow-scrolling:touch;text-size-adjust:100%}

/* ===================== LIGHT MODE ===================== */
:root{
  --sage:#A8C695;--sage-light:#D1DCC9;--sage-dark:#7BA85F;
  --cream:#FFF8F0;--warm:#F9F7F4;--text:#2D3E2F;--text-muted:#6B7A6F;
  --sky:#B4D7E8;--sky-dark:#8FC5DB;--mint:#D4E8E4;--mint-accent:#5FB3A0;
  --border:#E5DDD5;--border-light:#F0E8E0;
  --accent:#7BA85F;--accent-light:#A8C695;
  --r:12px;--r2:20px;--r3:32px;
  --shadow:0 8px 32px rgba(45,62,47,0.08);--shadow-lg:0 16px 48px rgba(45,62,47,0.12);
  --transition:0.35s cubic-bezier(0.34,1.56,0.64,1);
  /* dark mode toggle button */
  --dm-btn-bg:rgba(168,198,149,0.15);--dm-btn-border:var(--sage);--dm-btn-color:var(--sage-dark);
}

/* ===================== DARK MODE — Night Forest & Earth ===================== */
html.dark {
  /* Base — rich night-soil earth with a cool moonlit green cast */
  --warm: #111a12;           /* forest floor at night — dark, earthy green-black */
  --cream: #172119;          /* slightly raised ground — mossy dark green */

  /* Text — moonlit ivory, warm not blue */
  --text: #e8ead5;           /* pale moonlit grass blade */
  --text-muted: #8a9e82;     /* dry moss, faded fern */

  /* Sage → vivid dewy grass green */
  --sage: #6dbb78;           /* fresh night grass, lit by moon */
  --sage-light: #3d6644;     /* deep forest mid-layer */
  --sage-dark: #9dd4a0;      /* bright dew-kissed grass tip */

  /* Sky → earthy warm amber-brown (firefly / moonrise glow) */
  --sky: #5c4a2a;            /* dark tree bark */
  --sky-dark: #c9a96e;       /* warm amber — moonlight through leaves */

  /* Mint → deep undergrowth */
  --mint: #1d3320;
  --mint-accent: #7cc97e;    /* bioluminescent moss */

  /* Borders — subtle root lines in the soil */
  --border: #243328;
  --border-light: #1d2a1f;

  --accent: #6dbb78;
  --accent-light: #3d6644;

  /* Shadows — deep forest shadow */
  --shadow: 0 8px 28px rgba(5, 12, 6, 0.6);
  --shadow-lg: 0 20px 56px rgba(5, 12, 6, 0.75);

  --dm-btn-bg: rgba(109, 187, 120, 0.12);
  --dm-btn-border: #6dbb78;
  --dm-btn-color: #9dd4a0;
}

/* ── Night forest background — layered depth, NO backdrop-filter on background ── */
html.dark body {
  background: #111a12;
}

/* Deep forest atmosphere — fixed layers, GPU composited, no paint on scroll */
html.dark body::before {
  content: '';
  position: fixed;
  inset: 0;
  z-index: -2;
  pointer-events: none;
  /* Moonlight filtering through canopy, warm soil glow at base */
  background:
    radial-gradient(ellipse 90% 50% at 50% -5%,  rgba(109,187,120,0.07) 0%, transparent 65%),
    radial-gradient(ellipse 60% 40% at 15% 40%,  rgba(58,90,46,0.18)   0%, transparent 55%),
    radial-gradient(ellipse 50% 35% at 90% 70%,  rgba(44,62,28,0.15)   0%, transparent 55%),
    radial-gradient(ellipse 80% 30% at 50% 100%, rgba(28,20,10,0.45)   0%, transparent 60%),
    linear-gradient(180deg, #111a12 0%, #0d1510 55%, #0a1009 100%);
  will-change: transform;
  transform: translateZ(0);
}

/* Grass texture — fine diagonal grain across the page, very subtle */
html.dark body::after {
  content: '';
  position: fixed;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  opacity: 1;
  background-image:
    repeating-linear-gradient(
      80deg,
      transparent 0px,
      transparent 3px,
      rgba(60, 100, 50, 0.025) 3px,
      rgba(60, 100, 50, 0.025) 4px
    ),
    repeating-linear-gradient(
      170deg,
      transparent 0px,
      transparent 8px,
      rgba(30, 50, 20, 0.018) 8px,
      rgba(30, 50, 20, 0.018) 9px
    );
  will-change: transform;
  transform: translateZ(0);
}

/* ── Scrollbar — mossy earth ── */
html.dark ::-webkit-scrollbar-track { background: #0d1510; }
html.dark ::-webkit-scrollbar-thumb { background: #3a5e3c; border-radius: 10px; }

/* ── Cards — dark soil panels with mossy edge highlight ── */
html.dark .card,
html.dark .card-sm,
html.dark .pricing-card,
html.dark .feature-card,
html.dark .step-card,
html.dark .question-card,
html.dark .post-card,
html.dark .subject-dash-card,
html.dark .profile-header,
html.dark .gen-filter,
html.dark .chapter-item {
  background: #172119;
  border: 1px solid #243328;
  border-top: 1px solid rgba(109, 187, 120, 0.06);
  box-shadow: var(--shadow);
  /* NO backdrop-filter — kills scroll performance */
}

html.dark .subject-card {
  background: #172119;
  border-color: #243328;
}

/* ── Nav & Sidebar — solid, no backdrop-filter ── */
html.dark .pub-nav {
  background: rgba(13, 21, 14, 0.97);
  /* backdrop-filter intentionally removed for scroll perf */
  border-bottom: 1px solid #243328;
  box-shadow: 0 2px 20px rgba(5,12,6,0.5);
}
html.dark .sidebar {
  background: #0f1810;
  /* backdrop-filter intentionally removed for scroll perf */
  border-right: 1px solid #243328;
}

html.dark .page-header { background: rgba(17,26,18,0.6); border-color: #243328; }
html.dark footer { background: #0a1009; border-color: #243328; }
html.dark .modal { background: #172119; border: 1px solid #243328; }
html.dark .modal-overlay { background: rgba(5, 12, 6, 0.78); }
html.dark #toast { background: #172119; border-color: #243328; }

/* ── Inputs ── */
html.dark .input,
html.dark .select,
html.dark .search-input {
  background: #1d2a1f;
  color: var(--text);
  border-color: #243328;
  /* remove backdrop-filter */
  backdrop-filter: none;
  -webkit-backdrop-filter: none;
}
html.dark .input:focus,
html.dark .select:focus,
html.dark .search-input:focus { border-color: var(--sage); background: #223325; }
html.dark .input::placeholder,
html.dark .search-input::placeholder { color: var(--text-muted); }

/* ── Buttons ── */
html.dark .btn-primary { background: var(--sage); color: #111a12; }
html.dark .btn-primary:hover { background: var(--sage-dark); }

/* ── Chips, badges ── */
html.dark .topic-chip { background: #1d2a1f; border-color: #3a5e3c; color: var(--text); }
html.dark .topic-chip:hover,
html.dark .topic-chip.selected { background: var(--sage); color: #111a12; border-color: var(--sage); }

html.dark .badge { background: rgba(109,187,120,0.10); color: var(--sage-dark); }
html.dark .badge-mint { background: rgba(124,201,126,0.10); color: var(--mint-accent); }
html.dark .badge-muted { background: #1d2a1f; color: var(--text-muted); }

/* ── Sidebar links ── */
html.dark .sidebar-link.active { background: rgba(109,187,120,0.10); color: var(--sage-dark); border-left: 3px solid var(--sage); }
html.dark .sidebar-link:hover { background: rgba(109,187,120,0.06); color: var(--text); }

/* ── Stat cards, resource items ── */
html.dark .stat-card { background: rgba(23,33,25,0.8); border-color: #243328; }
html.dark .resource-item { background: #172119; border-color: #243328; }

/* ── Section alt (striped rows) ── */
html.dark .section.alt,
html.dark section[style*="rgba(168,198,149,0.05)"] { background: rgba(20,30,18,0.5) !important; }

/* ── Progress ── */
html.dark .progress-bar { background: #1d2a1f; }

/* ── Dividers, tabs ── */
html.dark .tabs { border-color: #243328; }
html.dark .divider { background: linear-gradient(90deg, transparent, #243328, transparent); }

/* ── Hover glows — like fireflies in undergrowth ── */
html.dark .card:hover,
html.dark .subject-card:hover,
html.dark .feature-card:hover,
html.dark .post-card:hover,
html.dark .subject-dash-card:hover {
  border-color: var(--sage);
  box-shadow: 0 16px 48px rgba(5,12,6,0.7), 0 0 22px rgba(109,187,120,0.09);
}

/* ── Streak badge ── */
html.dark .streak-badge {
  background: rgba(201,169,110,0.12);
  border-color: var(--sky-dark);
  color: var(--sky-dark);
}

/* ── Hero atmosphere ── */
html.dark .hero::before {
  background: radial-gradient(circle, rgba(109,187,120,0.10) 0%, transparent 70%);
}
html.dark .hero::after {
  background: radial-gradient(circle, rgba(44,62,28,0.25) 0%, transparent 70%);
}

/* Forest night animations */
html.dark .glow { animation: fireflyPulse 3s ease-in-out infinite; }
html.dark .streak-badge { animation: amberGlow 3s ease-in-out infinite; }

/* ── dm-toggle glow ── */
html.dark #dm-toggle { box-shadow: 0 0 10px rgba(109,187,120,0.20); }
/* ===================== SCROLL PERFORMANCE ===================== */
/* Promote scroll containers to their own compositor layer */
body{
  font-family:'Inter',sans-serif;background:var(--warm);color:var(--text);min-height:100vh;overflow-x:hidden;line-height:1.6;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  /* Avoid repaints during scroll by isolating stacking contexts */
  isolation:isolate;
}

/* Contain paint for sidebar & nav so scroll doesn't repaint them */
.pub-nav,.sidebar{
  will-change:transform;
  contain:layout style paint;
  transform:translateZ(0);
}

/* In dark mode: strip ALL backdrop-filters (they cause scroll lag) */
html.dark .pub-nav,
html.dark .sidebar,
html.dark .modal,
html.dark .hero-mockup,
html.dark .input,
html.dark .select,
html.dark .search-input {
  -webkit-backdrop-filter: none !important;
  backdrop-filter: none !important;
}

/* Only animate transform/opacity (compositor-only props) */
.card,.feature-card,.subject-card,.subject-dash-card,.step-card,.post-card,.pricing-card{
  will-change:transform;
  transform:translateZ(0);
}

/* Remove costly backdrop-filter on non-critical elements when scrolling */
@media(prefers-reduced-motion:reduce){
  .fade-in,.slide-left,.slide-right,.float,.glow,.scale-in{animation:none!important}
}

/* Limit expensive backdrop-filters to only key surfaces */
.pub-nav,.sidebar,.modal,.hero-mockup{
  -webkit-backdrop-filter:blur(12px);
  backdrop-filter:blur(12px);
  will-change:transform;
}

/* Smooth colour transition when toggling dark mode */
body,
.card,.card-sm,.subject-card,.feature-card,.step-card,.pricing-card,
.pub-nav,.sidebar,.page-header,footer,#toast,
.stat-card,.resource-item,.gen-filter,.question-card,.post-card,
.modal,.input,.select,.search-input{
  transition:background-color 0.4s ease,border-color 0.4s ease,color 0.3s ease;
}

/* Dark mode toggle button */
#dm-toggle{
  display:inline-flex;align-items:center;gap:6px;
  padding:8px 14px;border-radius:999px;
  background:var(--dm-btn-bg);
  border:1.5px solid var(--dm-btn-border);
  color:var(--dm-btn-color);
  font-size:13px;font-weight:700;
  cursor:pointer;transition:all 0.3s;
  font-family:'Inter',sans-serif;
  flex-shrink:0;
}
#dm-toggle:hover{transform:scale(1.06)}
html.dark #dm-toggle{box-shadow:0 0 12px rgba(109,187,120,0.22)}
h1,h2,h3,h4,h5{font-family:'Playfair Display',serif;line-height:1.2}
a{color:var(--accent);text-decoration:none}
button{cursor:pointer;font-family:'Inter',sans-serif;border:none;background:none}
input,select,textarea{font-family:'Inter',sans-serif}
img{max-width:100%}

/* SCROLLBAR */
::-webkit-scrollbar{width:8px}
::-webkit-scrollbar-track{background:var(--warm);transition:background 0.4s}
::-webkit-scrollbar-thumb{background:var(--sage);border-radius:4px}
* { scrollbar-width: thin; scrollbar-color: var(--sage) var(--warm); }

/* ANIMATIONS */
@keyframes fadeIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideInLeft{from{opacity:0;transform:translateX(-40px)}to{opacity:1;transform:translateX(0)}}
@keyframes slideInRight{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:translateX(0)}}
@keyframes slideUp{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:translateY(0)}}
@keyframes floatSlow{0%,100%{transform:translateY(0px)}50%{transform:translateY(-12px)}}
@keyframes glowPulse{0%,100%{box-shadow:0 0 20px rgba(123,168,95,0.15)}50%{box-shadow:0 0 40px rgba(123,168,95,0.3)}}
@keyframes scaleIn{from{opacity:0;transform:scale(0.95)}to{opacity:1;transform:scale(1)}}
@keyframes shimmer{0%{background-position:0% 50%}100%{background-position:100% 50%}}
/* Forest night — firefly flicker on cards */
@keyframes fireflyPulse{0%,100%{box-shadow:0 0 0 rgba(109,187,120,0)}50%{box-shadow:0 0 16px rgba(109,187,120,0.14)}}
/* Amber moonrise glow for streak badge */
@keyframes amberGlow{0%,100%{box-shadow:0 0 8px rgba(201,169,110,0.1)}50%{box-shadow:0 0 18px rgba(201,169,110,0.22)}}

.fade-in{animation:fadeIn 0.6s ease-out}.fade-in-delay{animation:fadeIn 0.6s ease-out;animation-fill-mode:both}
.slide-left{animation:slideInLeft 0.6s ease-out}.slide-right{animation:slideInRight 0.6s ease-out}
.float{animation:floatSlow 3s ease-in-out infinite}.glow{animation:glowPulse 3s ease-in-out infinite}
.scale-in{animation:scaleIn 0.5s ease-out}

/* UTILITIES */
.hidden{display:none!important}.flex{display:flex}.flex-col{flex-direction:column}.items-center{align-items:center}
.justify-between{justify-content:space-between}.justify-center{justify-content:center}
.gap-1{gap:8px}.gap-2{gap:12px}.gap-3{gap:16px}.gap-4{gap:24px}.gap-6{gap:32px}
.grid{display:grid}.grid-2{grid-template-columns:repeat(2,1fr)}.grid-3{grid-template-columns:repeat(3,1fr)}.grid-auto{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.text-muted{color:var(--text-muted)}.text-sage{color:var(--sage)}.text-mint{color:var(--mint-accent)}.text-sky{color:var(--sky-dark)}
.text-sm{font-size:14px}.text-xs{font-size:12px}.text-lg{font-size:18px}.text-xl{font-size:22px}.text-2xl{font-size:28px}.text-3xl{font-size:36px}.text-4xl{font-size:48px}
.font-bold{font-weight:700}.font-semi{font-weight:600}.font-med{font-weight:500}
.mt-1{margin-top:8px}.mt-2{margin-top:12px}.mt-3{margin-top:16px}.mt-4{margin-top:24px}.mt-6{margin-top:32px}
.mb-1{margin-bottom:8px}.mb-2{margin-bottom:12px}.mb-3{margin-bottom:16px}.mb-4{margin-bottom:24px}.mb-6{margin-bottom:32px}
.p-2{padding:12px}.p-3{padding:16px}.p-4{padding:24px}.p-6{padding:32px}
.rounded{border-radius:var(--r)}.rounded-lg{border-radius:var(--r2)}.rounded-xl{border-radius:var(--r3)}.rounded-full{border-radius:9999px}
.truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.relative{position:relative}.absolute{position:absolute}.w-full{width:100%}

/* CARDS */
.card{background:rgba(255,248,240,0.92);border:1px solid var(--border);border-radius:var(--r2);padding:24px;transition:transform 0.3s ease,box-shadow 0.3s ease,border-color 0.3s ease,background-color 0.4s ease;box-shadow:var(--shadow);cursor:pointer;will-change:transform;transform:translateZ(0)}
.card:hover{border-color:var(--sage);box-shadow:var(--shadow-lg);transform:translateY(-4px)}
.card-sm{background:rgba(255,248,240,0.92);border:1px solid var(--border);border-radius:var(--r);padding:16px;transition:background-color 0.4s ease,border-color 0.3s ease}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 24px;border-radius:var(--r);font-size:14px;font-weight:600;transition:all 0.3s ease;cursor:pointer;border:none;font-family:'Inter',sans-serif}
.btn-primary{background:var(--sage);color:#fff}
.btn-primary:hover{background:var(--sage-dark);transform:translateY(-2px);box-shadow:0 12px 24px rgba(123,168,95,0.3)}
.btn-secondary{background:transparent;color:var(--text);border:1.5px solid var(--sage)}
.btn-secondary:hover{background:var(--sage);color:#fff}
.btn-ghost{background:transparent;color:var(--text-muted);border:none}
.btn-ghost:hover{color:var(--text)}
.btn-lg{padding:16px 32px;font-size:16px;border-radius:var(--r2)}
.btn-sm{padding:8px 16px;font-size:13px}
.btn-icon{padding:10px;width:40px;height:40px;justify-content:center}

/* BADGES */
.badge{display:inline-flex;align-items:center;gap:4px;padding:4px 12px;border-radius:999px;font-size:12px;font-weight:600;background:rgba(168,198,149,0.15);color:var(--sage-dark)}
.badge-mint{background:rgba(95,179,160,0.15);color:var(--mint-accent)}.badge-sky{background:rgba(180,215,232,0.2);color:var(--sky-dark)}
.badge-muted{background:var(--border-light);color:var(--text-muted)}

/* INPUTS */
.input{background:rgba(255,255,255,0.6);backdrop-filter:blur(4px);border:1.5px solid var(--border);color:var(--text);padding:12px 16px;border-radius:var(--r);font-size:14px;transition:all 0.3s;width:100%}
.input:focus{outline:none;border-color:var(--sage);background:rgba(255,255,255,0.9)}
.input::placeholder{color:var(--text-muted);opacity:0.6}
.select{background:rgba(255,255,255,0.6);backdrop-filter:blur(4px);border:1.5px solid var(--border);color:var(--text);padding:12px 16px;border-radius:var(--r);font-size:14px;width:100%;cursor:pointer;transition:all 0.3s}
.select:focus{outline:none;border-color:var(--sage)}
.label{display:block;font-size:13px;font-weight:600;color:var(--text);margin-bottom:8px}
.checkbox{width:18px;height:18px;cursor:pointer;accent-color:var(--sage)}

/* PROGRESS */
.progress-bar{background:var(--border);border-radius:999px;height:6px;overflow:hidden}
.progress-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--sage),var(--mint-accent));transition:width 0.8s cubic-bezier(0.34,1.56,0.64,1)}

/* TABS */
.tabs{display:flex;gap:2px;background:transparent;padding:0;border-bottom:2px solid var(--border)}
.tab{padding:12px 20px;border-radius:0;font-size:14px;font-weight:600;color:var(--text-muted);cursor:pointer;transition:all 0.3s;border:none;background:none;font-family:'Inter',sans-serif;border-bottom:3px solid transparent}
.tab.active{color:var(--text);border-bottom-color:var(--sage)}
.tab:hover:not(.active){color:var(--text)}

/* DIVIDER */
.divider{height:1px;background:linear-gradient(90deg,transparent,var(--border),transparent);margin:20px 0}

/* NAV */
.pub-nav{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(249,247,244,0.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:0 40px;height:64px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 4px 12px rgba(45,62,47,0.08)}
.pub-nav .logo{font-family:'Playfair Display',serif;font-size:24px;font-weight:700;color:var(--text);cursor:pointer;letter-spacing:-1px}
.pub-nav .logo span{color:var(--sage)}
.nav-links{display:flex;gap:2px;align-items:center}
.nav-link{padding:10px 16px;border-radius:var(--r);color:var(--text-muted);font-size:14px;font-weight:500;cursor:pointer;transition:all 0.3s}
.nav-link:hover{color:var(--text);background:rgba(168,198,149,0.1)}
.nav-actions{display:flex;align-items:center;gap:12px}

/* SIDEBAR */
.app-layout{display:flex;min-height:100vh}
.sidebar{width:260px;background:rgba(249,247,244,0.9);backdrop-filter:blur(12px);border-right:1px solid var(--border);position:fixed;top:0;left:0;bottom:0;display:flex;flex-direction:column;z-index:50;box-shadow:4px 0 12px rgba(45,62,47,0.08)}
.sidebar-logo{padding:24px 20px;font-family:'Playfair Display',serif;font-size:20px;font-weight:700;color:var(--text);border-bottom:1px solid var(--border)}
.sidebar-logo span{color:var(--sage)}
.sidebar-nav{flex:1;padding:16px 12px;overflow-y:auto;display:flex;flex-direction:column;gap:4px}
.sidebar-link{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:var(--r);color:var(--text-muted);font-size:14px;font-weight:500;cursor:pointer;transition:all 0.3s}
.sidebar-link:hover{background:rgba(168,198,149,0.1);color:var(--text)}
.sidebar-link.active{background:rgba(168,198,149,0.2);color:var(--sage-dark)}
.sidebar-link .icon{width:20px;text-align:center;font-size:16px}
.sidebar-section{font-size:11px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.12em;padding:12px 14px 6px;margin-top:8px}
.sidebar-footer{padding:16px 12px;border-top:1px solid var(--border)}
.sidebar-user{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:var(--r);cursor:pointer;transition:all 0.3s}
.sidebar-user:hover{background:rgba(168,198,149,0.1)}
.avatar{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--sage),var(--mint-accent));border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:#fff}
.main-content{margin-left:260px;flex:1;min-height:100vh}
.sidebar{transition:transform 0.25s ease}
#app.sb-collapsed .sidebar{transform:translateX(-100%)}
#app.sb-collapsed .main-content{margin-left:0}
#sbOpen{position:fixed;top:14px;left:14px;z-index:60;width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;line-height:1;cursor:pointer;background:var(--sage);color:#fff;border:none;box-shadow:var(--shadow)}
#sbBackdrop{display:none;position:fixed;inset:0;background:rgba(20,30,20,0.45);z-index:45}
#sbBackdrop.show{display:block}
.sb-collapse-btn{background:none;border:none;cursor:pointer;font-size:20px;color:var(--text-muted);line-height:1;padding:2px 8px;border-radius:6px}
.sb-collapse-btn:hover{background:var(--border);color:var(--text)}
.page-header{padding:32px 40px 24px;border-bottom:1px solid var(--border);background:rgba(249,247,244,0.5)}
.page-body{padding:32px 40px}

/* HERO */
.hero{min-height:calc(100vh - 64px);display:flex;align-items:center;padding:100px 80px 60px;position:relative;overflow:hidden;margin-top:64px}
.hero::before{content:'';position:absolute;top:-400px;right:-200px;width:700px;height:700px;background:radial-gradient(circle,rgba(168,198,149,0.15) 0%,transparent 70%);border-radius:50%;pointer-events:none}
.hero::after{content:'';position:absolute;bottom:-300px;left:-100px;width:500px;height:500px;background:radial-gradient(circle,rgba(180,215,232,0.1) 0%,transparent 70%);border-radius:50%;pointer-events:none}
.hero-content{max-width:600px;z-index:1}
.hero-badge{display:inline-flex;align-items:center;gap:8px;background:rgba(168,198,149,0.2);border:1px solid var(--sage);color:var(--sage-dark);padding:8px 16px;border-radius:999px;font-size:13px;font-weight:700;margin-bottom:24px;animation:fadeIn 0.6s ease-out}
.hero h1{font-size:64px;font-weight:700;line-height:1.1;margin-bottom:24px;color:var(--text);animation:slideInLeft 0.8s ease-out}
.hero h1 .accent{color:var(--sage)}
.hero p{font-size:18px;color:var(--text-muted);margin-bottom:32px;line-height:1.7;animation:slideInLeft 0.8s ease-out;animation-delay:0.1s}
.hero-actions{display:flex;gap:16px;align-items:center;animation:slideInLeft 0.8s ease-out;animation-delay:0.2s}
.hero-mockup{position:absolute;right:5%;top:50%;transform:translateY(-50%);width:500px;background:rgba(255,248,240,0.95);backdrop-filter:blur(16px);border:1px solid var(--border);border-radius:var(--r3);padding:24px;box-shadow:var(--shadow-lg);animation:slideInRight 0.8s ease-out;animation-delay:0.3s}
.hero-mockup:hover{transform:translateY(calc(-50% - 8px))}

/* STATS */
.stats-bar{background:transparent;border-top:1px solid var(--border);border-bottom:1px solid var(--border);padding:40px 80px;display:grid;grid-template-columns:repeat(5,1fr);gap:32px;margin-top:40px}
.stat-item{text-align:center;animation:fadeIn 0.6s ease-out}
.stat-num{font-family:'Playfair Display',serif;font-size:36px;font-weight:700;color:var(--sage);display:block}
.stat-label{font-size:14px;color:var(--text-muted);margin-top:4px}

/* SECTIONS */
.section{padding:80px;position:relative}.section.alt{background:rgba(168,198,149,0.05)}
.section-header{text-align:center;margin-bottom:60px}
.section-header h2{font-size:44px;font-weight:700;margin-bottom:16px;color:var(--text)}
.section-header p{font-size:18px;color:var(--text-muted);max-width:580px;margin:0 auto;line-height:1.7}
.section-tag{display:inline-flex;background:rgba(168,198,149,0.15);color:var(--sage-dark);padding:6px 14px;border-radius:999px;font-size:12px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;margin-bottom:16px}

/* SUBJECT CARDS */
.subject-card{background:rgba(255,248,240,0.92);border:1.5px solid var(--border);border-radius:var(--r3);padding:32px;transition:transform 0.3s ease,box-shadow 0.3s ease,border-color 0.3s ease,background-color 0.4s ease;cursor:pointer;position:relative;overflow:hidden;animation:fadeIn 0.6s ease-out;will-change:transform;transform:translateZ(0)}
.subject-card::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;border-radius:var(--r3) var(--r3) 0 0}
.subject-card.math::before{background:linear-gradient(90deg,var(--sage),var(--mint-accent))}
.subject-card.physics::before{background:linear-gradient(90deg,var(--sky),var(--sage-light))}
.subject-card.cs::before{background:linear-gradient(90deg,#F4D9A8,var(--sage))}
.subject-card.chem::before{background:linear-gradient(90deg,var(--mint-accent),var(--sky))}
.subject-card.bio::before{background:linear-gradient(90deg,var(--sage-light),var(--sage))}
.subject-card:hover{border-color:var(--sage);transform:translateY(-8px);box-shadow:var(--shadow-lg)}
.subject-icon{width:60px;height:60px;border-radius:var(--r2);display:flex;align-items:center;justify-content:center;font-size:28px;margin-bottom:16px;background:rgba(168,198,149,0.1)}

/* FEATURE CARDS */
.feature-card{background:rgba(255,248,240,0.92);border:1px solid var(--border);border-radius:var(--r2);padding:28px;transition:transform 0.3s ease,box-shadow 0.3s ease,border-color 0.3s ease,background-color 0.4s ease;animation:fadeIn 0.6s ease-out;will-change:transform;transform:translateZ(0)}
.feature-card:hover{border-color:var(--sage);transform:translateY(-6px);box-shadow:var(--shadow-lg)}
.feature-icon{width:50px;height:50px;border-radius:var(--r);display:flex;align-items:center;justify-content:center;font-size:24px;margin-bottom:16px;background:rgba(168,198,149,0.15)}

/* PRICING */
.pricing-card{background:rgba(255,248,240,0.95);border:1.5px solid var(--border);border-radius:var(--r3);padding:36px;transition:transform 0.3s ease,box-shadow 0.3s ease,border-color 0.3s ease,background-color 0.4s ease;position:relative;will-change:transform;transform:translateZ(0)}
.pricing-card.popular{border-color:var(--sage);box-shadow:0 0 40px rgba(168,198,149,0.2)}
.pricing-card:hover{transform:translateY(-8px);box-shadow:var(--shadow-lg)}
.price{font-family:'Playfair Display',serif;font-size:48px;font-weight:700;color:var(--text)}
.price span{font-size:18px;color:var(--text-muted)}
.pricing-feature{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);font-size:14px}
.pricing-feature:last-child{border-bottom:none}.check{color:var(--mint-accent);font-weight:700}

/* STEP CARDS */
.step-card{background:rgba(255,248,240,0.8);backdrop-filter:blur(10px);border:1px solid var(--border);border-radius:var(--r2);padding:32px;position:relative;text-align:center;transition:var(--transition);animation:fadeIn 0.6s ease-out}
.step-card:hover{border-color:var(--sage);transform:translateY(-6px)}
.step-num{width:48px;height:48px;background:linear-gradient(135deg,var(--sage),var(--mint-accent));border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Playfair Display',serif;font-weight:700;font-size:20px;color:#fff;margin:0 auto 20px;box-shadow:0 8px 16px rgba(123,168,95,0.2)}

/* FOOTER */
footer{background:rgba(249,247,244,0.95);border-top:1px solid var(--border);padding:48px 80px}
.footer-grid{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:48px}
.footer-logo{font-family:'Playfair Display',serif;font-size:22px;font-weight:700;margin-bottom:12px;color:var(--text)}
.footer-logo span{color:var(--sage)}
.footer-col h4{font-size:12px;font-weight:700;color:var(--text);text-transform:uppercase;letter-spacing:0.12em;margin-bottom:16px}
.footer-link{display:block;color:var(--text-muted);font-size:14px;padding:6px 0;cursor:pointer;transition:color 0.3s}
.footer-link:hover{color:var(--text)}
.footer-bottom{margin-top:40px;padding-top:24px;border-top:1px solid var(--border);display:flex;justify-content:space-between;font-size:13px;color:var(--text-muted)}

/* DASHBOARD CARDS */
.subject-dash-card{background:rgba(255,248,240,0.95);border:1.5px solid var(--border);border-radius:var(--r2);padding:24px;cursor:pointer;transition:transform 0.3s ease,box-shadow 0.3s ease,border-color 0.3s ease,background-color 0.4s ease;position:relative;overflow:hidden;animation:fadeIn 0.6s ease-out;will-change:transform;transform:translateZ(0)}
.subject-dash-card::after{content:'';position:absolute;bottom:0;left:0;right:0;height:3px}
.subject-dash-card.math::after{background:linear-gradient(90deg,var(--sage),var(--mint-accent))}
.subject-dash-card.physics::after{background:linear-gradient(90deg,var(--sky),var(--sage))}
.subject-dash-card.cs::after{background:linear-gradient(90deg,#F4D9A8,var(--sage))}
.subject-dash-card.chem::after{background:linear-gradient(90deg,var(--mint-accent),var(--sky))}
.subject-dash-card.bio::after{background:linear-gradient(90deg,var(--sage-light),var(--sage))}
.subject-dash-card:hover{border-color:var(--sage);transform:translateY(-4px);box-shadow:var(--shadow-lg)}

/* STAT CARD */
.stat-card{background:rgba(255,248,240,0.8);border:1px solid var(--border);border-radius:var(--r);padding:16px;text-align:center}
.stat-card .num{font-family:'Playfair Display',serif;font-size:32px;font-weight:700;color:var(--sage);display:block}
.stat-card .lbl{font-size:12px;color:var(--text-muted);margin-top:4px}

/* ACTIVITY */
.activity-item{display:flex;align-items:center;gap:16px;padding:14px 0;border-bottom:1px solid var(--border);animation:fadeIn 0.6s ease-out}
.activity-item:last-child{border-bottom:none}
.activity-dot{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;background:rgba(168,198,149,0.15)}

/* PAPERS */
.paper-row{display:flex;align-items:center;justify-content:space-between;padding:16px 0;border-bottom:1px solid var(--border);transition:all 0.3s}
.paper-row:last-child{border-bottom:none}.paper-row:hover{background:rgba(168,198,149,0.05);padding:16px 12px;margin:0 -12px;border-radius:var(--r)}
.paper-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
@media(max-width:640px){.paper-row{flex-direction:column;align-items:stretch;gap:10px}.paper-actions{width:100%}.paper-actions .btn{flex:1;justify-content:center;white-space:nowrap}}

/* GENERATOR */
.gen-filter{background:rgba(255,248,240,0.8);border:1px solid var(--border);border-radius:var(--r2);padding:24px}
.topic-chip{display:inline-flex;align-items:center;gap:6px;background:rgba(168,198,149,0.15);border:1px solid var(--sage);padding:8px 14px;border-radius:999px;font-size:13px;cursor:pointer;transition:all 0.3s;margin:6px;color:var(--text)}
.topic-chip:hover,.topic-chip.selected{background:var(--sage);color:#fff;border-color:var(--sage)}
.question-card{background:rgba(255,248,240,0.8);border:1px solid var(--border);border-radius:var(--r2);padding:24px;margin-bottom:16px;transition:all 0.3s;animation:fadeIn 0.6s ease-out}
.question-card:hover{border-color:var(--sage);box-shadow:var(--shadow)}
.q-img{background:rgba(168,198,149,0.08);border:2px dashed var(--border);border-radius:var(--r);height:180px;display:flex;align-items:center;justify-content:center;color:var(--text-muted);font-size:14px;margin:16px 0}
.answer-box{background:rgba(95,179,160,0.1);border:1px solid rgba(95,179,160,0.3);border-radius:var(--r);padding:18px;margin-top:14px}

/* CHARTS */
.chart-bar-wrap{display:flex;align-items:flex-end;gap:10px;height:180px;padding:16px 0}
.chart-bar{flex:1;background:linear-gradient(180deg,var(--sage),var(--sage-light));border:1px solid var(--sage);border-radius:8px 8px 0 0;transition:all 0.3s;min-width:28px;cursor:pointer;position:relative}
.chart-bar:hover{background:linear-gradient(180deg,var(--sage-dark),var(--sage));transform:scaleY(1.05)}
.chart-bar .bar-label{position:absolute;bottom:-24px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--text-muted);white-space:nowrap}
.chart-bar .bar-val{position:absolute;top:-24px;left:50%;transform:translateX(-50%);font-size:12px;font-weight:600;color:var(--sage-dark)}

/* SYLLABUS */
.chapter-item{background:rgba(255,248,240,0.8);border:1px solid var(--border);border-radius:var(--r);padding:18px;margin-bottom:8px;cursor:pointer;transition:all 0.3s}
.chapter-item:hover{border-color:var(--sage);background:rgba(168,198,149,0.08)}
.chapter-item.done{border-color:rgba(95,179,160,0.4);background:rgba(95,179,160,0.08)}
.subtopic{padding:10px 0 10px 24px;border-left:2px solid var(--border);margin-left:8px;margin-top:8px;font-size:13px;color:var(--text-muted);display:flex;align-items:center;gap:10px;transition:all 0.3s}
.subtopic:hover{color:var(--text)}.subtopic.done{color:var(--mint-accent);border-color:var(--mint-accent)}

/* COMMUNITY */
.post-card{background:rgba(255,248,240,0.95);border:1px solid var(--border);border-radius:var(--r2);padding:22px;margin-bottom:14px;cursor:pointer;transition:transform 0.3s ease,box-shadow 0.3s ease,border-color 0.3s ease,background-color 0.4s ease;will-change:transform;transform:translateZ(0)}
.post-card:hover{border-color:var(--sage);transform:translateY(-4px);box-shadow:var(--shadow)}
.user-mini{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--text-muted)}
.vote-btn{display:flex;align-items:center;gap:4px;font-size:13px;color:var(--text-muted);cursor:pointer;padding:6px 10px;border-radius:var(--r);transition:all 0.3s;border:none;background:none;font-family:'Inter',sans-serif}
.vote-btn:hover{background:rgba(168,198,149,0.15);color:var(--sage)}

/* RESOURCES */
.resource-item{display:flex;align-items:center;gap:14px;padding:16px;background:rgba(255,248,240,0.8);border:1px solid var(--border);border-radius:var(--r);margin-bottom:8px;cursor:pointer;transition:all 0.3s}
.resource-item:hover{border-color:var(--sage);background:rgba(168,198,149,0.05);transform:translateX(4px)}
.res-icon{width:44px;height:44px;border-radius:var(--r);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;background:rgba(168,198,149,0.15)}

/* PROFILE */
.profile-header{background:rgba(255,248,240,0.95);border:1px solid var(--border);border-radius:var(--r3);padding:32px;display:flex;align-items:center;gap:28px;animation:fadeIn 0.6s ease-out}
.avatar-lg{width:90px;height:90px;border-radius:50%;background:linear-gradient(135deg,var(--sage),var(--mint-accent));border:3px solid var(--border);display:flex;align-items:center;justify-content:center;font-family:'Playfair Display',serif;font-size:32px;font-weight:700;color:#fff}

/* SEARCH */
.search-wrap{position:relative}
.search-wrap .icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text-muted);font-size:16px}
.search-input{background:rgba(255,255,255,0.6);backdrop-filter:blur(4px);border:1.5px solid var(--border);color:var(--text);padding:12px 14px 12px 40px;border-radius:var(--r);font-size:14px;width:100%;transition:all 0.3s}
.search-input:focus{outline:none;border-color:var(--sage);background:rgba(255,255,255,0.9)}

/* STREAKS & BADGES */
.streak-badge{display:inline-flex;align-items:center;gap:8px;background:rgba(180,215,232,0.2);border:1px solid var(--sky);color:var(--sky-dark);padding:8px 14px;border-radius:999px;font-size:14px;font-weight:600;animation:glowPulse 3s ease-in-out infinite}

/* EMPTY STATE */
.empty-state{text-align:center;padding:60px 20px;color:var(--text-muted)}.empty-state .icon{font-size:48px;margin-bottom:16px;opacity:0.4}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(45,62,47,0.4);z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(8px)}
.modal{background:rgba(255,248,240,0.95);backdrop-filter:blur(16px);border:1px solid var(--border);border-radius:var(--r3);padding:36px;width:100%;max-width:480px;animation:scaleIn 0.35s cubic-bezier(0.34,1.56,0.64,1);box-shadow:var(--shadow-lg)}

/* TOAST */
#toast{position:fixed;bottom:88px;right:24px;background:rgba(249,247,244,0.95);backdrop-filter:blur(10px);border:1px solid var(--border);padding:14px 24px;border-radius:var(--r);font-size:14px;font-weight:500;z-index:9999;transition:all 0.3s;opacity:0;transform:translateY(8px);pointer-events:none;box-shadow:var(--shadow)}
#report-fab{position:fixed;bottom:24px;right:24px;z-index:900;display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:12px 20px;font-weight:700;box-shadow:var(--shadow-lg);transition:transform .2s,box-shadow .2s}
#report-fab:hover{transform:translateY(-2px)}
.topical-img{max-width:100%;border-radius:var(--r);border:1px solid var(--border);display:block;margin:8px 0;background:#fff;cursor:zoom-in}
#toast.show{opacity:1;transform:translateY(0)}

/* TEST MODE */
.test-opts{display:flex;flex-direction:column;gap:10px}
.test-opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:18px 22px;border-radius:var(--r2);border:1.5px solid var(--border);background:rgba(255,248,240,0.6);cursor:pointer;font-size:16px;font-weight:600;color:var(--text);transition:border-color .15s,background-color .15s,opacity .15s}
.test-opt:hover{border-color:var(--sage);background:rgba(168,198,149,0.08)}
.test-opt-letter{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;font-size:16px;border-radius:50%;background:var(--border);color:var(--text);font-weight:800;flex-shrink:0}
.test-opt.opt-selected{border-color:var(--sage);background:rgba(168,198,149,0.14)}
.test-opt.opt-selected .test-opt-letter{background:var(--sage);color:#fff}
.test-opt.opt-correct{border-color:var(--sage);background:rgba(168,198,149,0.2)}
.test-opt.opt-correct .test-opt-letter{background:var(--sage);color:#fff}
.test-opt.opt-wrong{border-color:#FF6B6B;background:rgba(255,107,107,0.12)}
.test-opt.opt-wrong .test-opt-letter{background:#FF6B6B;color:#fff}
.test-opt.opt-dim{opacity:.5}
.test-opt-mark{margin-left:auto;font-weight:800;font-size:18px}
.test-feedback{margin-top:12px;padding:10px 14px;border-radius:var(--r);font-weight:600;font-size:14px}
.test-feedback.ok{background:rgba(168,198,149,0.18);color:var(--sage-dark)}
.test-feedback.bad{background:rgba(255,107,107,0.12);color:#FF6B6B}
.test-layout{display:flex;gap:26px;align-items:flex-start;max-width:1180px}
.test-q{flex:1 1 58%;min-width:0}
.test-q .topical-img{width:100%}
.test-a{flex:1 1 42%;min-width:0;position:sticky;top:20px}
@media(max-width:820px){.test-layout{flex-direction:column}.test-a{position:static}}
.test-qnum{display:inline-block;font-size:12px;font-weight:800;color:var(--sage-dark);background:rgba(168,198,149,0.22);border-radius:6px;padding:2px 9px;margin-bottom:10px}
.test-qtext{font-size:18px;line-height:1.55;font-weight:600;color:var(--text)}
.test-opt-body{display:flex;flex-direction:column;gap:6px;flex:1;min-width:0}
.test-opt-text{line-height:1.45;word-break:break-word}
.test-opt-img{max-height:92px;max-width:100%;align-self:flex-start;border-radius:8px;background:#fff;border:1px solid var(--border);cursor:zoom-in}
.test-explain{margin-top:10px;padding:11px 13px;border-radius:var(--r2);background:rgba(0,0,0,0.035);font-size:13.5px;line-height:1.5;color:var(--text-muted)}
.test-explain b{color:var(--text)}
.goal-card{display:flex;justify-content:space-between;align-items:center;gap:16px;background:linear-gradient(135deg,rgba(168,198,149,0.16),rgba(95,179,160,0.10));border:1px solid var(--border);border-radius:var(--r);padding:16px 20px;margin-bottom:16px;flex-wrap:wrap}
.goal-card.goal-empty{background:rgba(255,248,240,0.7)}
.goal-main{min-width:0}
.goal-title{font-weight:800;font-size:15px}
.goal-sub{font-weight:600;color:var(--text-muted);font-size:12px}
.goal-big{font-size:30px;font-weight:800;color:var(--sage-dark);line-height:1.15;margin:2px 0}
.goal-of{font-size:14px;font-weight:700;color:var(--text-muted)}
.goal-side{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.goal-note{font-size:10.5px;color:var(--text-muted);background:rgba(0,0,0,0.05);padding:2px 7px;border-radius:6px;white-space:nowrap}
.goal-warn{margin-top:6px;font-size:12px;color:#b8730a;background:rgba(255,170,0,0.13);padding:6px 9px;border-radius:8px}
.goal-setup-list{max-height:50vh;overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding-right:2px}
.goal-setup-row{border:1px solid var(--border);border-radius:var(--r2);padding:12px 14px;background:rgba(255,248,240,0.5)}
.goal-setup-head{font-weight:800;font-size:14px;margin-bottom:8px}
.grade-row{display:flex;gap:6px;flex-wrap:wrap}
.grade-pick{min-width:42px;padding:8px 12px;border-radius:10px;border:1.5px solid var(--border);background:transparent;font-weight:800;cursor:pointer;color:var(--text);transition:border-color .12s,background-color .12s,color .12s}
.grade-pick:hover{border-color:var(--sage)}
.grade-pick.sel{background:var(--sage);color:#fff;border-color:var(--sage)}
.goal-a2{margin-top:10px}
.lb-row{display:flex;align-items:center;gap:12px;padding:12px 6px;border-bottom:1px solid var(--border)}
.lb-row:last-child{border-bottom:none}
.lb-rank{width:44px;font-weight:800;font-size:15px;text-align:center;flex-shrink:0}
.lb-name{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb-stars{font-weight:800;color:var(--sage-dark);white-space:nowrap}
.lb-me{background:rgba(168,198,149,0.12);border-radius:10px}
.post-actions{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
.post-act{display:inline-flex;align-items:center;gap:5px;background:transparent;border:1px solid var(--border);border-radius:20px;padding:5px 12px;font-size:13px;font-weight:600;color:var(--text-muted);cursor:pointer;transition:border-color .12s,background-color .12s,color .12s}
.post-act:hover{border-color:var(--sage);color:var(--text)}
.post-act.voted{background:var(--sage);color:#fff;border-color:var(--sage)}
.post-replies{margin-top:10px;padding-top:10px;border-top:1px solid var(--border)}
.reply-item{display:flex;gap:8px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--border)}
.reply-item:last-of-type{border-bottom:none}
.reply-box{margin-top:8px}
.exam-card{display:flex;justify-content:space-between;align-items:center;gap:16px;background:linear-gradient(135deg,rgba(180,215,232,0.22),rgba(95,179,160,0.10));border:1px solid var(--border);border-radius:var(--r);padding:16px 20px;flex-wrap:wrap}
.exam-dates{display:flex;flex-direction:column;gap:8px}
.exam-date-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}

function subjectGoal(subject){const g=state.goals;const th=THRESHOLDS[subject];if(!g||!g.year||!th)return null;const sg=(g.subjects||{})[subject];if(!sg||!sg.target)return null;if(g.year==='AS'){const need=th.as.grades[sg.target];if(need==null)return null;return{year:'AS',target:sg.target,need,max:th.as.max};}const alNeed=th.al.grades[sg.target];if(alNeed==null)return null;const known=sg.knowMark&&sg.asMark!=null&&sg.asMark!=='';const asMark=known?Math.max(0,Math.min(th.as.max,Number(sg.asMark))):(th.as.grades[sg.asGrade]!=null?th.as.grades[sg.asGrade]:0);const a2Max=th.al.max-th.as.max;let remaining=alNeed-asMark;if(remaining<0)remaining=0;const overCap=remaining>a2Max;return{year:'A2',target:sg.target,alNeed,asMark,a2Max,remaining:Math.min(remaining,a2Max),overCap,knownMark:known,asGrade:sg.asGrade,asMax:th.as.max};}

function renderGoalSetupModal(){const d=state.goalDraft||{year:'AS',subjects:{}};const yr=d.year;const set=GRADE_SETS[yr];const yearBtns=[['AS','AS · Year 1'],['A2','A2 · full A Level']].map(([y,lbl])=>`<button class="btn btn-sm ${yr===y?'btn-primary':'btn-secondary'}" onclick="setDraftYear('${y}')">${lbl}</button>`).join('');const rows=(state.user.subjects||[]).map(s=>{const sub=SUBJECTS[s];const sd=d.subjects[s]||{};const targetBtns=set.map(g=>`<button class="grade-pick ${sd.target===g?'sel':''}" onclick="setDraftTarget('${s}','${g}')">${g}</button>`).join('');let a2='';if(yr==='A2'){const asMax=THRESHOLDS[s]?THRESHOLDS[s].as.max:100;if(sd.knowMark){a2=`<div class="goal-a2"><label class="label">Your AS mark (out of ${asMax})</label><div class="flex items-center gap-2" style="flex-wrap:wrap"><input id="gm-mark-${s}" class="input" type="number" min="0" max="${asMax}" value="${sd.asMark!=null?sd.asMark:''}" placeholder="e.g. 96" style="max-width:130px"><button class="btn btn-ghost btn-sm" onclick="toggleDraftKnow('${s}')">I don't know it</button></div></div>`;}else{const asBtns=GRADE_SETS.AS.map(g=>`<button class="grade-pick ${sd.asGrade===g?'sel':''}" onclick="setDraftAsGrade('${s}','${g}')">${g}</button>`).join('');a2=`<div class="goal-a2"><label class="label">Your AS grade</label><div class="grade-row">${asBtns}</div><button class="btn btn-ghost btn-sm" style="margin-top:6px" onclick="toggleDraftKnow('${s}')">I know my exact mark</button></div>`;}}return `<div class="goal-setup-row"><div class="goal-setup-head">${sub?sub.emoji:''} ${sub?sub.name:s}</div><label class="label">Target grade</label><div class="grade-row">${targetBtns}</div>${a2}</div>`;}).join('');return `<div class="modal fade-in" onclick="event.stopPropagation()" style="max-width:520px"><div class="flex items-center justify-between mb-3"><h2 style="font-size:22px;font-weight:800">Your grade goals 🎯</h2><button class="btn-icon btn" onclick="closeModal()">✕</button></div><p class="text-sm text-muted mb-3">Where are you right now?</p><div class="flex gap-2 mb-4">${yearBtns}</div><div class="goal-setup-list">${rows}</div><p class="text-xs text-muted mt-3">Boundaries are estimates from recent sessions and change every exam — treat the marks as a guide. Update anytime in Settings.</p><button class="btn btn-primary w-full btn-lg mt-3" onclick="saveGoalSetup()">Save goals</button></div>`;}
function renderGoalCard(subject){const g=subjectGoal(subject);if(!state.goals.year||!g){return `<div class="goal-card goal-empty"><div class="goal-main"><div class="goal-title">🎯 Set a grade goal</div><div class="text-xs text-muted">Pick your target grade to see the marks you're aiming for.</div></div><button class="btn btn-primary btn-sm" onclick="openGoalSetup()">Set goal</button></div>`;}if(g.year==='AS'){const pct=Math.round(g.need/g.max*100);return `<div class="goal-card"><div class="goal-main"><div class="goal-title">🎯 Target: grade ${g.target} <span class="goal-sub">· AS</span></div><div class="goal-big">${g.need}<span class="goal-of">/${g.max} marks</span></div><div class="text-xs text-muted">needed for grade ${g.target} · about ${pct}%</div></div><div class="goal-side"><span class="goal-note">≈ estimated boundary</span><button class="btn btn-ghost btn-sm" onclick="openGoalSetup()">Edit</button></div></div>`;}const src=g.knownMark?`based on your AS mark ${g.asMark}/${g.asMax}`:`estimated from AS grade ${g.asGrade}`;const warn=g.overCap?`<div class="goal-warn">That grade may be out of reach from your AS mark — you'd need close to full marks in the A2 papers.</div>`:'';return `<div class="goal-card"><div class="goal-main"><div class="goal-title">🎯 Target: A Level ${g.target}</div><div class="goal-big">${g.remaining}<span class="goal-of"> more marks</span></div><div class="text-xs text-muted">in the A2 papers (out of ${g.a2Max}) · ${src}</div>${warn}</div><div class="goal-side"><span class="goal-note">≈ estimated boundary</span><button class="btn btn-ghost btn-sm" onclick="openGoalSetup()">Edit</button></div></div>`;}

function onAvatarPick(e){const file=e.target.files&&e.target.files[0];if(!file)return;if(!/^image\//.test(file.type)){toast('Please choose an image file');return}if(file.size>10*1024*1024){toast('Image too large (max 10 MB)');return}const reader=new FileReader();reader.onerror=()=>toast('Could not read that file');reader.onload=ev=>{const img=new Image();img.onerror=()=>toast('Could not read that image');img.onload=()=>{const size=256,c=document.createElement('canvas');c.width=size;c.height=size;const ctx=c.getContext('2d');const scale=Math.max(size/img.width,size/img.height),w=img.width*scale,h=img.height*scale;ctx.drawImage(img,(size-w)/2,(size-h)/2,w,h);let url;try{url=c.toDataURL('image/jpeg',0.85)}catch(err){toast('Could not process image');return}setAvatar(url)};img.src=ev.target.result};reader.readAsDataURL(file)}

function renderSVGRing(pct,color='var(--sage)',size=64,stroke=6){const r=(size-stroke*2)/2;const circ=2*Math.PI*r;const filled=circ*(pct/100);const cx=size/2,cy=size/2;return`<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--border)" stroke-width="${stroke}"/><circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}" stroke-dasharray="${filled} ${circ-filled}" stroke-dashoffset="${circ/4}" stroke-linecap="round" transform="rotate(-90 ${cx} ${cy})"/></svg>`}

function timeAgo(iso){if(!iso)return '';const s=Math.max(0,Math.floor((Date.now()-new Date(iso).getTime())/1000));if(s<60)return 'just now';const m=Math.floor(s/60);if(m<60)return m+'m ago';const h=Math.floor(m/60);if(h<24)return h+'h ago';const d=Math.floor(h/24);return d+'d ago'}
function renderRecentActivity(){
  const items=state.topicalQuestions.map(q=>{const a=state.topicalAttempts[q.id];return a&&a.updated_at?{q,a}:null}).filter(Boolean).sort((x,y)=>new Date(y.a.updated_at)-new Date(x.a.updated_at)).slice(0,6);
  if(!items.length)return `<div class="empty-state" style="padding:20px 0"><p class="text-sm">No activity yet</p><p class="text-xs mt-2">Attempt questions in Topical and they'll show up here.</p></div>`;
  return items.map(o=>{const q=o.q,a=o.a,ok=a.correct===true;return `<div class="activity-item"><div class="activity-dot" style="background:${ok?'rgba(168,198,149,0.18)':'rgba(255,107,107,0.15)'}">${ok?'✓':'✗'}</div><div style="flex:1;min-width:0"><div class="font-med text-sm">${ok?'Got it right':'Got it wrong'} · ${q.chapter}</div><div class="text-xs text-muted">${SUBJECTS[q.subject]?SUBJECTS[q.subject].name:q.subject}</div></div><div class="text-xs text-muted" style="white-space:nowrap">${timeAgo(a.updated_at)}</div></div>`;}).join('');
}
function renderNeedsAttention(){
  const g={};
  state.topicalQuestions.forEach(q=>{const a=state.topicalAttempts[q.id];if(a&&a.correct===false){const k=`${q.subject}|${q.chapter}`;if(!g[k])g[k]={topic:q.chapter,subject:SUBJECTS[q.subject]?SUBJECTS[q.subject].name:q.subject,count:0};g[k].count++}});
  const list=Object.values(g).sort((a,b)=>b.count-a.count).slice(0,5);
  if(!list.length)return `<div class="empty-state" style="padding:20px 0"><p class="text-sm">Nothing flagged yet</p><p class="text-xs mt-2">Mark questions wrong in Topical and your weakest topics rank here.</p></div>`;
  const max=list[0].count;
  return list.map((t,i)=>`<div style="margin-bottom:14px"><div class="flex justify-between mb-1"><span class="text-sm font-med">${i+1}. ${t.topic}</span><span class="text-sm" style="color:#FF6B6B">${t.count} wrong</span></div><div class="progress-bar"><div class="progress-fill" style="width:${Math.round(t.count/max*100)}%;background:#FF6B6B"></div></div><div class="text-xs text-muted mt-1">${t.subject}</div></div>`).join('');
}

function loadExamDates(){try{const raw=localStorage.getItem('aidify_examdates');if(raw){const o=JSON.parse(raw);if(o&&typeof o==='object')state.examDates=o}}catch(e){}}
function saveExamDates(){try{localStorage.setItem('aidify_examdates',JSON.stringify(state.examDates))}catch(e){}queueProgressSave()}
function setExamDate(s,pn,val){if(!state.examDates)state.examDates={};if(!state.examDates[s])state.examDates[s]={};if(val)state.examDates[s][pn]=val;else delete state.examDates[s][pn];saveExamDates();render()}
function daysUntil(dateStr){const d=new Date(dateStr+'T00:00:00');if(isNaN(d))return null;const n=new Date();const t=new Date(n.getFullYear(),n.getMonth(),n.getDate());return Math.round((d-t)/86400000)}
function examEntries(){const out=[];const ed=state.examDates||{};Object.keys(ed).forEach(s=>{const m=ed[s]||{};Object.keys(m).forEach(pn=>{const v=m[pn];const days=v?daysUntil(v):null;if(days!=null)out.push({subject:s,paperNum:+pn,date:v,days})})});return out}
function nextExam(){return examEntries().filter(e=>e.days>=0).sort((a,b)=>a.days-b.days)[0]||null}
function nextExamForSubject(s){return examEntries().filter(e=>e.subject===s&&e.days>=0).sort((a,b)=>a.days-b.days)[0]||null}
function examDaysLabel(days){return days===0?'Today':days===1?'Tomorrow':days+' days'}
function fmtExamDate(v,withWeekday){try{return new Date(v+'T00:00:00').toLocaleDateString(undefined,withWeekday?{weekday:'short',day:'numeric',month:'short',year:'numeric'}:{day:'numeric',month:'short',year:'numeric'})}catch(e){return v}}
function renderExamCountdownCard(){const nx=nextExam();if(!nx){const s0=state.user.subjects[0]||'math';return `<div class="exam-card mb-4"><div class="goal-main"><div class="goal-title">📅 Exam countdown</div><div class="text-xs text-muted">Add your paper dates in a subject's Past Papers tab to see a live countdown here.</div></div><button class="btn btn-primary btn-sm" onclick="navigate('subject',{activeSubject:'${s0}',subjectTab:'papers'})">Set dates</button></div>`}const sub=SUBJECTS[nx.subject];return `<div class="exam-card mb-4"><div class="goal-main"><div class="goal-title">📅 Next exam · ${sub?sub.emoji:''} ${sub?sub.name:nx.subject} · Paper ${nx.paperNum}</div><div class="goal-big">${examDaysLabel(nx.days)}</div><div class="text-xs text-muted">${fmtExamDate(nx.date,true)}${nx.days>0?" · you've got this":''}</div></div><button class="btn btn-ghost btn-sm" onclick="navigate('subject',{activeSubject:'${nx.subject}',subjectTab:'papers'})">Edit</button></div>`}
function renderExamDatesCard(s){const cnt=SUBJECTS[s]?SUBJECTS[s].papers:0;if(!cnt)return '';const ed=(state.examDates||{})[s]||{};const nx=nextExamForSubject(s);const inputs=Array.from({length:cnt},(_,i)=>i+1).map(pn=>`<div class="exam-date-row"><label class="label" style="margin:0;min-width:64px">Paper ${pn}</label><input type="date" class="input" style="max-width:190px" value="${ed[pn]||''}" onchange="setExamDate('${s}',${pn},this.value)"></div>`).join('');const head=nx?`<span class="text-sm" style="color:var(--sage-dark);font-weight:700">${examDaysLabel(nx.days)} → Paper ${nx.paperNum}</span>`:`<span class="text-xs text-muted">No upcoming dates set</span>`;return `<div class="card mb-4"><div class="flex justify-between items-center mb-3" style="flex-wrap:wrap;gap:6px"><h3 style="font-weight:800;font-size:16px">📅 Exam dates</h3>${head}</div><div class="exam-dates">${inputs}</div></div>`}
function renderDashboard(){const hour=new Date().getHours();const greeting=hour<12?'Good morning':hour<17?'Good afternoon':'Good evening';const totalLogged=Object.keys(state.trackerPapers).length;return`${renderSidebar()}<div class="main-content"><div class="page-header"><div class="flex items-center justify-between" style="padding-bottom:20px"><div><div class="text-muted text-sm mb-1">${greeting} 👋</div><h1 style="font-size:26px;font-weight:800">${state.user.name}</h1></div><div class="flex gap-2 items-center"><div class="streak-badge">🔥 ${state.user.streak}-day streak</div><div class="badge">⭐ ${totalStars()} stars</div></div></div><div class="grid" style="grid-template-columns:repeat(4,1fr);gap:12px;padding-bottom:20px">${[{num:totalLogged,lbl:'Papers Done'},{num:totalStars(),lbl:'Total Stars'},{num:state.user.streak,lbl:'Day Streak'},{num:state.user.subjects.length,lbl:'Subjects'}].map(s=>`<div class="stat-card"><span class="num" style="color:var(--sage)">${s.num}</span><div class="lbl">${s.lbl}</div></div>`).join('')}</div></div><div class="page-body">${renderExamCountdownCard()}<div class="flex items-center justify-between mb-3"><h2 style="font-size:18px;font-weight:800">My Subjects</h2><button class="btn btn-ghost btn-sm">+ Add Subject</button></div><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-bottom:32px">${state.user.subjects.map(s=>{const sub=SUBJECTS[s];const total=PAST_PAPERS.filter(p=>p.subject===s).length;const logged=Object.keys(state.trackerPapers).filter(c=>{const p=PAST_PAPERS.find(x=>x.code===c);return p&&p.subject===s}).length;const prog=total?Math.round(logged/total*100):0;return`<div class="subject-dash-card ${s}" onclick="navigate('subject',{activeSubject:'${s}',subjectTab:'papers'})"><div class="flex justify-between items-start mb-3"><div><div style="font-size:24px;margin-bottom:6px">${sub.emoji}</div><h3 style="font-size:17px;font-weight:800">${sub.name}</h3><p class="text-sm text-muted">${sub.code}</p></div><div style="width:70px;height:70px">${renderSVGRing(prog,'var(--sage)')}</div></div><div class="progress-bar mb-2"><div class="progress-fill" style="width:${prog}%"></div></div><div class="flex justify-between text-xs text-muted mb-3"><span>${prog}% complete</span><span>${logged} / ${total} papers</span></div><div class="flex gap-1"><button class="btn btn-sm btn-secondary" style="flex:1;font-size:12px" onclick="event.stopPropagation();navigate('topical',{activeSubject:'${s}'})">📝 Generate</button><button class="btn btn-sm btn-secondary" style="flex:1;font-size:12px" onclick="event.stopPropagation();navigate('subject',{activeSubject:'${s}',subjectTab:'tracker'})">📊 Tracker</button></div></div>`;}).join('')}</div><div class="grid grid-2 gap-4"><div class="card"><h3 style="font-size:16px;font-weight:800;margin-bottom:16px">Recent Activity</h3>${renderRecentActivity()}</div><div class="card"><h3 style="font-size:16px;font-weight:800;margin-bottom:4px">Needs Attention</h3><p class="text-xs text-muted mb-3">Your weakest topics from Topical wrong answers</p>${renderNeedsAttention()}</div></div></div></div>`}

function renderSubject(){const sub=SUBJECTS[state.activeSubject];const tabContent={papers:renderPapersTab,generator:renderGeneratorTab,resources:renderResourcesTab,hardest:renderHardestTab,tracker:renderTrackerTab,syllabus:renderSyllabusTab,community:renderCommunityTab}[state.subjectTab]();const tabs=[{id:'papers',label:'📄 Past Papers'},{id:'resources',label:'📚 Resources'},{id:'hardest',label:'🔥 20 Hardest'},{id:'tracker',label:'📊 Tracker'},{id:'syllabus',label:'✅ Syllabus'},{id:'community',label:'💬 Community'}];return`${renderSidebar()}<div class="main-content"><div class="page-header"><div class="flex items-center gap-2 text-sm text-muted mb-3"><span style="cursor:pointer" onclick="navigate('dashboard')">Dashboard</span><span>›</span><span style="color:var(--text)">${sub.name}</span></div><div class="flex items-center justify-between mb-4"><div class="flex items-center gap-3"><div style="font-size:36px">${sub.emoji}</div><div><h1 style="font-size:26px;font-weight:800">${sub.name}</h1><p class="text-sm text-muted">${sub.code} · ${sub.papers} past papers · ${sub.questions.toLocaleString()} questions</p></div></div><div class="flex gap-2"><div class="badge">⭐ ${subjectStars(state.activeSubject)} stars earned</div><div class="badge badge-muted">${state.user.progress[state.activeSubject]||0}% complete</div></div></div><div style="overflow-x:auto;padding-bottom:1px"><div class="tabs" style="width:max-content">${tabs.map(t=>`<button class="tab ${state.subjectTab===t.id?'active':''}" onclick="navigate('subject',{activeSubject:'${state.activeSubject}',subjectTab:'${t.id}'})">${t.label}</button>`).join('')}</div></div></div><div class="page-body fade-in">${renderGoalCard(state.activeSubject)}${tabContent}</div></div>`}

function renderPapersTab(){
  if(!state.papersFilter)state.papersFilter='all';
  const subjectPapers=PAST_PAPERS.filter(p=>p.subject===state.activeSubject);
  const maxPaperNum=Math.max(...subjectPapers.map(p=>p.paperNum));
  const paperNums=Array.from({length:maxPaperNum},(_,i)=>i+1);
  const filtered=state.papersFilter==='all'?subjectPapers:subjectPapers.filter(p=>state.papersFilter.includes(p.paperNum));
  const years=[...new Set(filtered.map(p=>p.year))].sort((a,b)=>b-a);
  const isAll=state.papersFilter==='all';
  const allChip=`<div class="topic-chip ${isAll?'selected':''}" onclick="setPapersFilterAll()">All</div>`;
  const filterChips=paperNums.map(n=>{
    const selected=!isAll&&state.papersFilter.includes(n);
    return `<div class="topic-chip ${selected?'selected':''}" onclick="togglePapersFilter(${n})">Paper ${n}</div>`;
  }).join('');
  return `${renderExamDatesCard(state.activeSubject)}<div class="mb-4"><div class="flex justify-between items-center mb-3"><h2 style="font-size:18px;font-weight:800">Past Papers</h2><span class="badge badge-muted">${filtered.length} papers</span></div><label class="label">Filter by Paper</label><div style="display:flex;flex-wrap:wrap;gap:4px;margin-top:6px">${allChip}${filterChips}</div></div>${filtered.length===0?'<p class="text-sm text-muted" style="text-align:center;padding:40px">No papers match your filter.</p>':years.map(year=>{const papers=filtered.filter(p=>p.year===year);return`<div class="card mb-3"><div class="flex items-center gap-2 mb-3"><span class="badge">${year}</span></div>${papers.map(p=>{const completed=state.trackerPapers[p.code];return`<div class="paper-row"><div><div class="font-med text-sm">${p.code}</div><div class="text-xs text-muted">${p.name} · ${p.season}</div></div><div class="paper-actions">${completed!==undefined?`<span class="badge badge-mint">✓ ${completed}/${p.maxMarks} (${Math.round(completed/p.maxMarks*100)}%)</span>`:''}<a class="btn btn-ghost btn-sm" href="${paperExternalUrl(p,'qp')}" target="_blank" rel="noopener">📄 Paper</a><a class="btn btn-ghost btn-sm" href="${paperExternalUrl(p,'ms')}" target="_blank" rel="noopener">📝 Mark Scheme</a><button class="btn btn-sm ${completed!==undefined?'btn-secondary':'btn-primary'}" onclick="markPaper('${p.code}')">${completed!==undefined?'Update Score':'Mark Done'}</button></div></div>`;}).join('')}</div>`;}).join('')}`;
}

function setPapersFilterAll(){state.papersFilter='all';render()}
function togglePapersFilter(n){
  if(state.papersFilter==='all'){state.papersFilter=[n];render();return}
  if(state.papersFilter.includes(n))state.papersFilter=state.papersFilter.filter(x=>x!==n);
  else state.papersFilter.push(n);
  if(state.papersFilter.length===0)state.papersFilter='all';
  render();
}

function markPaper(code){const paper=PAST_PAPERS.find(p=>p.code===code);if(!paper)return;const existing=state.trackerPapers[code];const modal=document.getElementById('modal');modal.classList.remove('hidden');modal.innerHTML=`<div class="modal fade-in" onclick="event.stopPropagation()"><div class="flex items-center justify-between mb-4"><h2 style="font-size:22px;font-weight:800">${existing!==undefined?'Update Score':'Enter Score'}</h2><button class="btn-icon btn" onclick="closeModal()">✕</button></div><p class="text-muted text-sm mb-4">${code} · ${paper.name} · ${paper.season} ${paper.year}</p><div style="margin-bottom:20px"><label class="label">Your Score (out of ${paper.maxMarks})</label><input id="scoreInput" class="input" type="number" min="0" max="${paper.maxMarks}" placeholder="e.g. ${Math.floor(paper.maxMarks*0.7)}" value="${existing!==undefined?existing:''}" autofocus /></div><button class="btn btn-primary w-full btn-lg" onclick="saveScore('${code}',${paper.maxMarks})">${existing!==undefined?'Update Score':'Save Score'}</button>${existing!==undefined?`<button class="btn btn-ghost w-full mt-2" style="color:#e8b4a0" onclick="deleteScore('${code}')">Remove Score</button>`:''}</div>`;modal.onclick=(e)=>{if(e.target===modal)closeModal()};setTimeout(()=>{const inp=document.getElementById('scoreInput');if(inp){inp.focus();inp.addEventListener('keydown',e=>{if(e.key==='Enter')saveScore(code,paper.maxMarks)})}},50)}

async function saveScore(code,max){const inp=document.getElementById('scoreInput');const val=inp.value.trim();if(!val||isNaN(val)){toast('Please enter a valid number');return}const s=parseInt(val);if(s<0||s>max){toast(`Score must be between 0 and ${max}`);return}const {error}=await window.supabase.from('scores').upsert({paper_code:code,score:s,subject:state.activeSubject},{onConflict:'user_id,paper_code'});if(error){toast('Error saving: '+error.message);return}state.trackerPapers[code]=s;refreshRank();closeModal();toast(`Score saved: ${s}/${max} (${Math.round(s/max*100)}%) ✓`);render()}

async function deleteScore(code){const {error}=await window.supabase.from('scores').delete().eq('paper_code',code);if(error){toast('Error removing: '+error.message);return}delete state.trackerPapers[code];closeModal();toast('Score removed');render()}

function reportBug(){const modal=document.getElementById('modal');modal.classList.remove('hidden');modal.innerHTML=`<div class="modal fade-in" onclick="event.stopPropagation()"><div class="flex items-center justify-between mb-4"><h2 style="font-size:22px;font-weight:800">Report a Bug</h2><button class="btn-icon btn" onclick="closeModal()">✕</button></div><p class="text-muted text-sm mb-4">Found something broken or confusing? Tell us what happened and we'll look into it.</p><div style="margin-bottom:20px"><label class="label">What went wrong?</label><textarea id="bugInput" class="input" rows="5" style="resize:vertical;min-height:120px" placeholder="Describe the bug — what you did, what you expected, and what actually happened..."></textarea></div><button class="btn btn-primary w-full btn-lg" onclick="submitReport()">Send Report</button></div>`;modal.onclick=(e)=>{if(e.target===modal)closeModal()};setTimeout(()=>{const t=document.getElementById('bugInput');if(t)t.focus()},50)}

async function submitReport(){const el=document.getElementById('bugInput');const message=el.value.trim();if(!message){toast('Please describe the bug first');return}const page=state.page==='subject'?`subject:${state.activeSubject}/${state.subjectTab}`:state.page;const {data:{user}}=await window.supabase.auth.getUser();const {error}=await window.supabase.from('bug_reports').insert({message,page,email:user?.email||null,user_agent:navigator.userAgent});if(error){toast('Could not send report: '+error.message);return}closeModal();toast('Thanks! Your report was sent 🐞')}

function qVariantCode(q){const m=(q.question_image||'').match(/_p(\d)(\d)_/i);return m?m[1]+m[2]:null}
function topicalFilter(qs,skip){skip=skip||{};return qs.filter(q=>{if(!skip.chapter&&state.genChapters.length&&!state.genChapters.includes(q.chapter))return false;if(!skip.paper&&state.genPapers.length&&!state.genPapers.includes(q.paper))return false;if(!skip.variant&&state.genVariants&&state.genVariants.length&&!state.genVariants.includes(qVariantCode(q)))return false;if(!skip.year&&(state.genYearFrom||state.genYearTo)){const y=+q.year;if(state.genYearFrom&&y<state.genYearFrom)return false;if(state.genYearTo&&y>state.genYearTo)return false}if(!skip.diff&&state.genDifficulty.length&&!state.genDifficulty.includes(q.difficulty))return false;return true})}
function toggleVariant(code){if(!state.genVariants)state.genVariants=[];const i=state.genVariants.indexOf(code);if(i>=0)state.genVariants.splice(i,1);else state.genVariants.push(code);render()}
function setYearFrom(v){state.genYearFrom=v?+v:null;render()}
function setYearTo(v){state.genYearTo=v?+v:null;render()}
function snapshotTopical(){const subj=state.activeSubject;const qs=state.topicalQuestions.filter(q=>q.subject===subj);const un=[],at=[];qs.forEach(q=>{(state.topicalAttempts[q.id]?at:un).push(String(q.id))});state.genOrderSnapshot=un.concat(at)}
function renderGeneratorTab(){
  if(!state.genVariants)state.genVariants=[];
  const all=state.topicalQuestions.filter(q=>q.subject===state.activeSubject);
  const chapters=[...new Set(all.map(q=>q.chapter).filter(Boolean))].sort();
  const years=[...new Set(all.map(q=>+q.year).filter(v=>v))].sort((a,b)=>a-b);
  const papers=[...new Set(all.map(q=>q.paper).filter(v=>v!=null&&v!==''))].sort((a,b)=>a-b);
  const diffs=['Easy','Medium','Hard'];
  const chapBase=topicalFilter(all,{chapter:true});const chapCounts={};chapBase.forEach(q=>{if(q.chapter)chapCounts[q.chapter]=(chapCounts[q.chapter]||0)+1});
  const variants=[...new Set(topicalFilter(all,{variant:true}).map(qVariantCode).filter(Boolean))].sort();
  let list=topicalFilter(all);
  if(state.genOrderSnapshot&&state.genOrderSnapshot.length){const snap=state.genOrderSnapshot,ix=id=>{const i=snap.indexOf(String(id));return i<0?1e9:i};list=[...list].sort((a,b)=>ix(a.id)-ix(b.id))}
  const attemptedCount=list.filter(q=>state.topicalAttempts[q.id]).length;
  const yearOpt=sel=>`<option value="">Any</option>`+years.map(y=>`<option value="${y}" ${String(sel)==String(y)?'selected':''}>${y}</option>`).join('');
  const chip=(label,sel,onclick)=>`<div class="topic-chip ${sel?'selected':''}" onclick="${onclick}">${label}</div>`;
  const esc=s=>String(s).replace(/'/g,"\\'");
  const filters=`<div class="card mb-4"><div class="mb-3"><h2 style="font-size:18px;font-weight:800">All Questions (${all.length})</h2><p class="text-sm text-muted">Showing ${list.length}${attemptedCount?` · ${attemptedCount} done (moved to the end)`:''} · ⭐ 1 star per correct answer</p></div><label class="label">Chapter</label><div style="display:flex;flex-wrap:wrap;gap:4px;margin-bottom:12px">${chapters.length?chapters.map(c=>chip(`${c} (${chapCounts[c]||0})`,state.genChapters.includes(c),`toggleChapter('${esc(c)}')`)).join(''):'<span class="text-xs text-muted">No chapters yet</span>'}</div><label class="label">Paper</label><div style="display:flex;flex-wrap:wrap;gap:4px;margin-bottom:12px">${papers.length?papers.map(p=>chip(`Paper ${p}`,state.genPapers.includes(p),`togglePaper(${p})`)).join(''):'<span class="text-xs text-muted">No papers yet</span>'}</div>${variants.length?`<label class="label">Variant</label><div style="display:flex;flex-wrap:wrap;gap:4px;margin-bottom:12px">${variants.map(v=>chip(v,state.genVariants.includes(v),`toggleVariant('${v}')`)).join('')}</div>`:''}<label class="label">Years</label><div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px"><span class="text-xs text-muted">From</span><select class="input" style="width:auto;display:inline-block" onchange="setYearFrom(this.value)">${yearOpt(state.genYearFrom)}</select><span class="text-xs text-muted">To</span><select class="input" style="width:auto;display:inline-block" onchange="setYearTo(this.value)">${yearOpt(state.genYearTo)}</select></div><label class="label">Difficulty</label><div style="display:flex;flex-wrap:wrap;gap:4px">${diffs.map(d=>chip(d,state.genDifficulty.includes(d),`toggleDifficulty('${d}')`)).join('')}</div></div>`;
  if(all.length===0)return `${filters}<div class="empty-state"><div class="icon">🎯</div><p>No topical questions yet</p><p class="text-xs mt-2">Add questions to your Supabase <b>topical_questions</b> table and they'll show up here automatically.</p></div>`;
  const body=list.length===0?`<div class="empty-state"><div class="icon">🔍</div><p>No questions match your filters</p></div>`:list.map(renderQuestionCard).join('');
  return `${filters}${body}`;
}

function renderQuestionCard(q){
  const a=state.topicalAttempts[q.id];const correct=a&&a.correct===true,wrong=a&&a.correct===false,attempts=a?a.attempts:0;const shown=state.showAnswers[q.id];
  const status=(correct?`<span class="badge badge-mint">✓ Correct</span>`:wrong?`<span class="badge" style="background:rgba(255,107,107,0.15);color:#FF6B6B">✗ Wrong</span>`:'')+(attempts>0?`<span class="badge badge-muted">Attempts: ${attempts}</span>`:'');
  return `<div class="question-card mb-3"><div class="flex justify-between items-start mb-2" style="gap:8px;flex-wrap:wrap"><div class="flex gap-1" style="flex-wrap:wrap"><span class="badge">${q.chapter}</span>${q.subtopic?String(q.subtopic).split(/[,;]/).map(s=>s.trim()).filter(Boolean).map(s=>`<span class="badge" style="background:rgba(95,179,160,0.14);color:var(--sage-dark)">↳ ${escapeHtml(s)}</span>`).join(''):''}${q.marks?`<span class="badge badge-muted">${q.marks} marks</span>`:''}${q.difficulty?`<span class="badge">${q.difficulty}</span>`:''}${q.year?`<span class="badge badge-muted">${q.year}</span>`:''}</div>${status}</div><img src="${q.question_image}" alt="Question" class="topical-img" onclick="window.open('${q.question_image}','_blank')" /><div class="flex gap-2 items-center mt-2" style="flex-wrap:wrap"><button id="ansbtn-${q.id}" class="btn btn-sm btn-ghost" onclick="toggleTopicalAnswer('${q.id}')">${shown?'▲ Hide Answer':'▼ Show Answer'}</button>${q.youtube_url?`<a class="btn btn-sm btn-ghost" href="${q.youtube_url}" target="_blank" rel="noopener">▶ YouTube</a>`:''}<button class="btn btn-sm ${correct?'btn-primary':'btn-secondary'}" onclick="markTopical('${q.id}',true)">✓ Got it right</button><button class="btn btn-sm ${wrong?'btn-primary':'btn-secondary'}" onclick="markTopical('${q.id}',false)">✗ Got it wrong</button></div><div id="ans-${q.id}" style="display:${shown?'block':'none'}"><div class="answer-box mt-2"><div class="text-sm font-semi text-mint mb-2">📋 Mark Scheme</div>${q.correct_answer?`<div class="text-sm font-semi mb-2" style="color:var(--sage-dark)">Answer: ${String(q.correct_answer).toUpperCase()}</div>`:''}${q.mark_scheme_image?`<img src="${q.mark_scheme_image}" alt="Mark scheme" class="topical-img" onclick="window.open('${q.mark_scheme_image}','_blank')" />`:''}${q.mark_scheme_text?`<div class="text-sm" style="white-space:pre-wrap">${q.mark_scheme_text}</div>`:''}${!q.mark_scheme_image&&!q.mark_scheme_text&&!q.correct_answer?'<div class="text-xs text-muted">No mark scheme added.</div>':''}</div></div></div>`;
}
function toggleYear(y){if(state.genYears.includes(y))state.genYears=state.genYears.filter(x=>x!==y);else state.genYears.push(y);render()}
function toggleChapter(c){if(state.genChapters.includes(c))state.genChapters=state.genChapters.filter(x=>x!==c);else state.genChapters.push(c);render()}
function togglePaper(p){if(state.genPapers.includes(p))state.genPapers=state.genPapers.filter(x=>x!==p);else state.genPapers.push(p);render()}
function toggleDifficulty(d){if(state.genDifficulty.includes(d))state.genDifficulty=state.genDifficulty.filter(x=>x!==d);else state.genDifficulty.push(d);render()}
function setTopicalView(v){state.topicalView=v;render()}
function toggleTopicalAnswer(id){const show=!state.showAnswers[id];state.showAnswers[id]=show;const box=document.getElementById('ans-'+id),btn=document.getElementById('ansbtn-'+id);if(box){box.style.display=show?'block':'none';if(show){box.style.animation='none';void box.offsetWidth;box.style.animation='fadeIn .3s ease'}}if(btn)btn.textContent=show?'▲ Hide Answer':'▼ Show Answer'}
async function markTopical(id,correct){const prev=state.topicalAttempts[id];const attempts=(prev?prev.attempts:0)+1;const wasCorrect=prev&&prev.correct===true;const now=new Date().toISOString();const {error}=await window.supabase.from('topical_attempts').upsert({question_id:id,correct,attempts,updated_at:now},{onConflict:'user_id,question_id'});if(error){toast('Could not save: '+error.message);return}state.topicalAttempts[id]={correct,attempts,updated_at:now};if(correct){toast(wasCorrect?`Correct again ✓ · ${attempts} attempts`:`Correct! +1 ⭐ · attempt ${attempts}`)}else{toast(`Added to Wrong Answers · attempt ${attempts}`)}render()}
