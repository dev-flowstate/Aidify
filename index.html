function seasonRank(s){return s==='Feb/Mar'?0:s==='May/June'?1:s==='Oct/Nov'?2:1}
function renderScoreChart(entries){
  const pts=entries.map(([code,score])=>{const p=PAST_PAPERS.find(x=>x.code===code);const pct=p?Math.round(score/p.maxMarks*100):0;return {code,pct,year:p?p.year:0,season:p?p.season:''}}).sort((a,b)=>a.year-b.year||seasonRank(a.season)-seasonRank(b.season));
  if(pts.length<2)return '';
  const W=340,H=170,padL=26,padR=12,padT=12,padB=24,iw=W-padL-padR,ih=H-padT-padB,n=pts.length;
  const x=i=>padL+iw*i/(n-1),y=v=>padT+ih*(1-v/100);
  const band=p=>p>=80?'var(--sage)':p>=50?'#7fb3d5':'#e8b4a0';
  const grid=[0,50,100].map(v=>`<line x1="${padL}" y1="${y(v).toFixed(1)}" x2="${W-padR}" y2="${y(v).toFixed(1)}" stroke="var(--border)" stroke-width="1" opacity="0.6"/><text x="${padL-5}" y="${(y(v)+3).toFixed(1)}" text-anchor="end" font-size="8" fill="var(--text-muted)">${v}</text>`).join('');
  const line=`<polyline points="${pts.map((p,i)=>`${x(i).toFixed(1)},${y(p.pct).toFixed(1)}`).join(' ')}" fill="none" stroke="var(--sage)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  const dots=pts.map((p,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(p.pct).toFixed(1)}" r="3.5" fill="${band(p.pct)}"><title>${p.code} · ${p.pct}%</title></circle>`).join('');
  const step=Math.max(1,Math.ceil(n/6));const xl=pts.map((p,i)=>(i%step===0||i===n-1)?`<text x="${x(i).toFixed(1)}" y="${H-7}" text-anchor="middle" font-size="7.5" fill="var(--text-muted)">'${String(p.year).slice(-2)}</text>`:'').join('');
  const first=pts[0].pct,last=pts[n-1].pct,diff=last-first;const trend=diff>0?`<span style="color:var(--sage)">▲ up ${diff}%</span>`:diff<0?`<span style="color:#e8967a">▼ down ${-diff}%</span>`:`<span class="text-muted">flat</span>`;
  return `<div class="card mb-4"><div class="flex justify-between items-center mb-1" style="flex-wrap:wrap;gap:6px"><h3 style="font-weight:800;font-size:16px">📈 Progress over time</h3><span class="text-xs">${trend} since first logged</span></div><p class="text-xs text-muted mb-2">Your scores in date order — earliest to latest.</p><svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;overflow:visible">${grid}${line}${dots}${xl}</svg></div>`;
}
function renderTrackerTab(){
  if(!state.trackerFilter)state.trackerFilter='all';
  const subjectPapers=PAST_PAPERS.filter(p=>p.subject===state.activeSubject);
  const maxPaperNum=Math.max(...subjectPapers.map(p=>p.paperNum));
  const paperNums=Array.from({length:maxPaperNum},(_,i)=>i+1);
  const subjectPaperCodes=new Set(subjectPapers.map(p=>p.code));
  const allLogged=Object.entries(state.trackerPapers).filter(([code])=>subjectPaperCodes.has(code));
  const isAll=state.trackerFilter==='all';
  const filteredPapers=isAll?allLogged:allLogged.filter(([code])=>{
    const p=PAST_PAPERS.find(x=>x.code===code);
    return p&&state.trackerFilter.includes(p.paperNum);
  });
  const pcts=filteredPapers.map(([code,score])=>{
    const p=PAST_PAPERS.find(x=>x.code===code);
    return p?Math.round(score/p.maxMarks*100):0;
  });
  const avg=pcts.length?Math.round(pcts.reduce((s,v)=>s+v,0)/pcts.length):0;
  const maxP=pcts.length?Math.max(...pcts):0;
  const minP=pcts.length?Math.min(...pcts):0;
  const allChip=`<div class="topic-chip ${isAll?'selected':''}" onclick="setTrackerFilterAll()">All</div>`;
  const filterChips=paperNums.map(n=>{
    const selected=!isAll&&state.trackerFilter.includes(n);
    return `<div class="topic-chip ${selected?'selected':''}" onclick="toggleTrackerFilter(${n})">Paper ${n}</div>`;
  }).join('');
  const color=p=>p>=80?'var(--sage)':p>=50?'#7fb3d5':'#e8b4a0';
  const header=`<div class="mb-4"><div class="flex justify-between items-center mb-3"><div><h2 style="font-size:18px;font-weight:800">Score Tracker</h2><p class="text-sm text-muted">Your logged past-paper scores</p></div><span class="badge badge-muted">${filteredPapers.length} logged</span></div><label class="label">Filter by Paper</label><div style="display:flex;flex-wrap:wrap;gap:4px;margin-top:6px">${allChip}${filterChips}</div></div>`;
  if(filteredPapers.length===0)return `${header}<div class="empty-state"><div class="icon">📊</div><p>No scores logged yet</p><p class="text-xs mt-2">Log scores from the Past Papers tab to see your progress here</p></div>`;
  const stats=[{icon:'📄',label:'Papers Logged',val:filteredPapers.length},{icon:'📈',label:'Average',val:avg+'%'},{icon:'🏆',label:'Highest',val:maxP+'%'},{icon:'📉',label:'Lowest',val:minP+'%'}].map(a=>`<div class="stat-card"><span class="num" style="font-size:20px">${a.icon}</span><span class="num" style="font-size:20px">${a.val}</span><div class="lbl">${a.label}</div></div>`).join('');
  const breakdown=[...filteredPapers].sort((a,b)=>b[0].localeCompare(a[0])).map(([code,score])=>{
    const p=PAST_PAPERS.find(x=>x.code===code);
    const pct=p?Math.round(score/p.maxMarks*100):0;
    return `<div class="mb-4"><div class="flex justify-between mb-1"><span class="font-med text-sm">${code}${p?` · ${p.name}`:''}</span><span class="text-sm font-semi" style="color:${color(pct)}">${score}/${p?p.maxMarks:'?'} · ${pct}%</span></div><div class="progress-bar"><div class="progress-fill" style="width:${pct}%;background:${color(pct)}"></div></div></div>`;
  }).join('');
  return `${header}<div class="grid grid-2 gap-3 mb-4">${stats}</div>${renderScoreChart(filteredPapers)}<div class="card"><h3 style="font-weight:800;margin-bottom:16px;font-size:16px">Score Breakdown</h3>${breakdown}</div>`;
}
function setTrackerFilterAll(){state.trackerFilter='all';render()}
function toggleTrackerFilter(n){
  if(state.trackerFilter==='all'){state.trackerFilter=[n];render();return}
  if(state.trackerFilter.includes(n))state.trackerFilter=state.trackerFilter.filter(x=>x!==n);
  else state.trackerFilter.push(n);
  if(state.trackerFilter.length===0)state.trackerFilter='all';
  render();
}

function renderSyllabusTab(){
  const sub=state.activeSubject;
  const chapters=SYLLABUS_CHAPTERS[sub]||[];
  const norm=t=>typeof t==='string'?{name:t,subs:[]}:{name:t.name,subs:Array.isArray(t.subs)?t.subs:[]};
  const unitKeys=(ci,ti,n)=>n.subs.length?n.subs.map((s,si)=>`${sub}-${ci}-${ti}-${si}`):[`${sub}-${ci}-${ti}`];
  let total=0,done=0;
  chapters.forEach((ch,ci)=>ch.topics.forEach((t,ti)=>unitKeys(ci,ti,norm(t)).forEach(k=>{total++;if(state.syllabus[k])done++})));
  const pct=total?Math.round(done/total*100):0;
  const head=`<div class="flex justify-between items-center mb-2" style="flex-wrap:wrap;gap:8px"><div><h2 style="font-size:18px;font-weight:800">Syllabus Tracker</h2><p class="text-sm text-muted">Tick off topics as you master them · ${(sub==='math'||sub==='cs')?'grouped by paper':(sub==='physics'||sub==='chem'||sub==='bio')?'grouped by level':'grouped by topic'}</p></div><span class="badge badge-mint">${done} / ${total} · ${pct}%</span></div><div class="progress-bar mb-4" style="height:10px"><div class="progress-fill" style="width:${pct}%"></div></div>`;
  if(!chapters.length)return `${head}<div class="empty-state"><div class="icon">✅</div><p>No syllabus available for this subject yet</p></div>`;
  const body=chapters.map((ch,ci)=>{
    const okey=`${sub}-${ci}`;const open=state.syllabusOpen[okey];
    let cTotal=0,cDone=0;
    ch.topics.forEach((t,ti)=>unitKeys(ci,ti,norm(t)).forEach(k=>{cTotal++;if(state.syllabus[k])cDone++}));
    const cPct=cTotal?Math.round(cDone/cTotal*100):0;
    const topicsHtml=ch.topics.map((t,ti)=>{
      const n=norm(t);
      if(!n.subs.length){
        const key=`${sub}-${ci}-${ti}`;const d=state.syllabus[key];
        return `<label class="subtopic ${d?'done':''}" style="display:flex;align-items:center;gap:10px;cursor:pointer"><input type="checkbox" class="checkbox" ${d?'checked':''} onchange="toggleSyllabus('${key}')">${n.name}</label>`;
      }
      const tkey=`${sub}-${ci}-t${ti}`;const topen=state.syllabusOpen[tkey];
      const sDone=n.subs.reduce((a,s,si)=>a+(state.syllabus[`${sub}-${ci}-${ti}-${si}`]?1:0),0);
      const subsHtml=n.subs.map((s,si)=>{const key=`${sub}-${ci}-${ti}-${si}`;const d=state.syllabus[key];return `<label class="subtopic ${d?'done':''}" style="display:flex;align-items:center;gap:10px;cursor:pointer"><input type="checkbox" class="checkbox" ${d?'checked':''} onchange="toggleSyllabus('${key}')">${s}</label>`;}).join('');
      return `<div style="border-left:2px solid var(--border);margin-left:8px;margin-top:4px"><div onclick="toggleSyllabusChapter('${tkey}')" style="cursor:pointer;display:flex;align-items:center;gap:8px;padding:8px 0 8px 14px"><span style="display:inline-block;font-size:10px;color:var(--text-muted);transform:rotate(${topen?90:0}deg);transition:transform .2s">▶</span><span class="text-sm font-med" style="flex:1">${n.name}</span><span class="text-xs text-muted" style="white-space:nowrap">${sDone}/${n.subs.length}</span></div><div style="display:${topen?'block':'none'};padding-left:30px">${subsHtml}</div></div>`;
    }).join('');
    return `<div class="card mb-2" style="padding:0;overflow:hidden"><div onclick="toggleSyllabusChapter('${okey}')" style="cursor:pointer;padding:14px 16px;display:flex;align-items:center;gap:12px"><span style="display:inline-block;font-size:11px;color:var(--text-muted);transform:rotate(${open?90:0}deg);transition:transform .2s">▶</span><div style="flex:1;min-width:0"><div class="font-semi text-sm">${ch.name}</div><div class="progress-bar mt-1" style="height:5px"><div class="progress-fill" style="width:${cPct}%"></div></div></div><span class="text-xs text-muted" style="white-space:nowrap">${cDone}/${cTotal}</span></div><div style="display:${open?'block':'none'};padding:0 16px 12px 42px">${topicsHtml}</div></div>`;
  }).join('');
  return `${head}${body}`;
}

function toggleSyllabus(key){state.syllabus[key]=!state.syllabus[key];render()}

// ---- Study timer: stopwatch + countdown. A module-level interval keeps it running across page navigation. ----
let _timerInt=null;
function fmtTimer(ms){ms=Math.max(0,Math.floor(ms/1000));const h=Math.floor(ms/3600),m=Math.floor(ms%3600/60),s=ms%60,p=n=>String(n).padStart(2,'0');return h>0?`${h}:${p(m)}:${p(s)}`:`${p(m)}:${p(s)}`}
function timerValue(){const t=state.timer;const live=t.base+(t.running?Date.now()-t.startedAt:0);return t.mode==='countdown'?Math.max(0,t.setMs-live):live}
function timerRefresh(){if(ensureStudyDay()){render();return}const el=document.getElementById('timerDisplay');if(el)el.textContent=fmtTimer(timerValue());if(state.timer.mode==='countdown'&&state.timer.running&&timerValue()<=0){timerPause();toast('⏰ Time\'s up!')}}
function timerStart(){const t=state.timer;if(t.running)return;if(t.mode==='countdown'&&t.setMs-t.base<=0)return;t.running=true;t.startedAt=Date.now();clearInterval(_timerInt);_timerInt=setInterval(timerRefresh,250);render()}
function timerPause(){const t=state.timer;if(t.running){t.base+=Date.now()-t.startedAt;t.running=false}clearInterval(_timerInt);_timerInt=null;render()}
function timerReset(){const t=state.timer;t.running=false;t.base=0;clearInterval(_timerInt);_timerInt=null;render()}
function timerMode(m){timerReset();state.timer.mode=m;render()}
function timerSet(mins){const t=state.timer;t.setMs=Math.max(0,mins)*60000;t.base=0;t.running=false;clearInterval(_timerInt);_timerInt=null;render()}
function timerSetCustom(){const hEl=document.getElementById('timerH'),mEl=document.getElementById('timerM');const h=Math.max(0,parseInt(hEl&&hEl.value)||0);const m=Math.max(0,parseInt(mEl&&mEl.value)||0);const t=state.timer;t.setMs=Math.max(0,(h*60+m)*60000);t.base=0;t.running=false;clearInterval(_timerInt);_timerInt=null;render()}
// ---- Daily study total (persisted in localStorage; resets at state.resetHour, default 4am) ----
function fmtStudy(ms){const total=Math.floor(ms/60000);const h=Math.floor(total/60),m=total%60;return h>0?`${h}h ${m}m`:`${m}m`}
function studyDayKey(){const h=state.resetHour||0;const d=new Date(Date.now()-h*3600000);return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`}
function saveStudy(){try{localStorage.setItem('aidify_study',JSON.stringify({dayKey:state.studyDayKey,totalMs:state.studyTotalMs}))}catch(e){}queueProgressSave()}
function loadStudy(){try{const rh=localStorage.getItem('aidify_resetHour');if(rh!=null)state.resetHour=parseInt(rh)}catch(e){}if(!(state.resetHour>=0&&state.resetHour<=23))state.resetHour=4;const cur=studyDayKey();try{const raw=localStorage.getItem('aidify_study');if(raw){const o=JSON.parse(raw);if(o&&o.dayKey===cur){state.studyTotalMs=o.totalMs||0;state.studyDayKey=cur;return}}}catch(e){}state.studyTotalMs=0;state.studyDayKey=cur;saveStudy()}
function addStudyMs(ms){const cur=studyDayKey();if(state.studyDayKey!==cur){state.studyTotalMs=0;state.studyDayKey=cur}state.studyTotalMs+=ms;saveStudy()}
function setResetHour(h){h=parseInt(h);if(!(h>=0&&h<=23))h=4;state.resetHour=h;state.studyDayKey=studyDayKey();try{localStorage.setItem('aidify_resetHour',String(h))}catch(e){}saveStudy();render()}
function dayStartMs(){const h=state.resetHour||0;const now=Date.now();const d=new Date();d.setHours(h,0,0,0);if(d.getTime()>now)d.setDate(d.getDate()-1);return d.getTime()}
// ---- Persist study-day rollover, timer state, and current page across refreshes ----
function ensureStudyDay(){const cur=studyDayKey();if(state.studyDayKey!==cur){state.studyTotalMs=0;state.studyDayKey=cur;saveStudy();return true}return false}
/* ===== Account sync: progress follows the user, not the browser ===== */
let _progressTimer=null;
function queueProgressSave(){if(!state.userId)return;if(_progressTimer)clearTimeout(_progressTimer);_progressTimer=setTimeout(()=>{_progressTimer=null;saveProgress()},1200)}
async function saveProgress(){try{if(!window.supabase||!state.userId)return;let sday='';try{sday=localStorage.getItem('aidify_streak_day')||''}catch(e){}await window.supabase.from('user_progress').upsert({user_id:state.userId,streak:state.user.streak||0,best_streak:state.user.bestStreak||0,streak_day:sday,study_ms:state.studyTotalMs||0,study_day:state.studyDayKey||'',reset_hour:state.resetHour||4,goals:state.goals||{},exam_dates:state.examDates||{},updated_at:new Date().toISOString()},{onConflict:'user_id'})}catch(e){}}

function saveTimer(){try{localStorage.setItem('aidify_timer',JSON.stringify(state.timer))}catch(e){}}

function saveNav(){try{localStorage.setItem('aidify_nav',JSON.stringify({page:state.page,activeSubject:state.activeSubject,subjectTab:state.subjectTab}))}catch(e){}}
function loadNavInto(){let page='dashboard',as=state.activeSubject,st=state.subjectTab;try{const raw=localStorage.getItem('aidify_nav');if(raw){const o=JSON.parse(raw);const valid=['dashboard','subject','community','profile','settings','topical','mcq','leaderboard'];if(o&&valid.indexOf(o.page)>=0)page=o.page;if(o&&o.activeSubject)as=o.activeSubject;if(o&&o.subjectTab)st=o.subjectTab}}catch(e){}state.page=page;state.activeSubject=as;state.subjectTab=st}
// ---- Daily login streak (localStorage; same reset-hour boundary as study total) ----
function streakDayKey(ms){const h=state.resetHour||0;const d=new Date(ms-h*3600000);return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`}
function updateStreak(){
  const today=streakDayKey(Date.now());
  const yest=streakDayKey(Date.now()-86400000);
  let streak=0,lastDay='';

  try{localStorage.setItem('aidify_streak',String(streak));localStorage.setItem('aidify_streak_day',today)}catch(e){}

/* ===== Profanity filter (Roblox-style): warn on post + mask the word everywhere =====
   Whole-word, case-insensitive. NOTE: 'sex'/'sexual' are deliberately NOT here — they're
   real Biology syllabus terms (sex cells, sex-linked). Edit BAD_WORDS to add/remove. */
const BAD_WORDS=['fuck','fuk','fuckin','fucking','fucked','fucker','fuckface','fuckboy','motherfucker','shit','shitty','bullshit','bitch','bitches','bastard','asshole','asshat','ass','arse','dumbass','jackass','dick','dickhead','cock','pussy','cunt','whore','slut','nigger','nigga','faggot','fag','retard','retarded','wanker','twat','bollocks','prick','dumbfuck'];
const BAD_RE=new RegExp('\\b('+BAD_WORDS.map(w=>w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')\\b','gi');
function censorText(text){if(text==null)return {clean:'',found:false};let found=false;const clean=String(text).replace(BAD_RE,m=>{found=true;return '*'.repeat(m.length)});return {clean,found};}
function cw(text){return censorText(text).clean}

  const tagStyle="display:inline-block;background:rgba(168,198,149,0.15);border:1px solid var(--border);border-radius:8px;padding:6px 10px;font-size:12.5px;font-weight:600;color:var(--text);text-decoration:none";
  let tagHtml='';

  else if(p.tag_type==='question'&&p.tag_ref){const q=(state.topicalQuestions||[]).find(x=>String(x.id)===String(p.tag_ref));tagHtml=`<div style="${tagStyle};cursor:default">🎯 ${escapeHtml(p.tag_label||'Topical question')}</div>${q&&q.question_image?`<img src="${q.question_image}" alt="Question" class="topical-img" style="margin-top:8px" onclick="window.open('${q.question_image}','_blank')" />`:''}`}
  const canDelete=p.user_id&&state.userId&&p.user_id===state.userId;
  const v=state.postVotes[p.id]||{count:0,mine:false};

  const footer=`<div class="post-actions"><button class="post-act ${v.mine?'voted':''}" onclick="toggleVote(${p.id})" title="Upvote">▲ <span>${v.count}</span></button><button class="post-act ${open?'voted':''}" onclick="toggleReplies(${p.id})">💬 <span>${reps.length}</span> ${reps.length===1?'reply':'replies'}</button>${canDelete?`<button class="post-act" onclick="deletePost(${p.id})">🗑</button>`:''}</div>`;
  const repliesHtml=open?`<div class="post-replies">${reps.map(renderReply).join('')||'<p class="text-xs text-muted" style="padding:4px 0 8px">No replies yet — be the first.</p>'}${state.userId?`<div class="reply-box"><textarea id="reply-${p.id}" class="input" rows="2" placeholder="Write a reply..." oninput="state.replyDraft[${p.id}]=this.value">${escapeHtml(state.replyDraft[p.id]||'')}</textarea><button class="btn btn-primary btn-sm mt-2" onclick="submitReply(${p.id})">Reply</button></div>`:'<p class="text-xs text-muted">Log in to reply.</p>'}</div>`:'';
  return `<div class="post-card"><div class="flex gap-2 mb-2 items-start"><div class="avatar" style="width:32px;height:32px;font-size:12px;flex-shrink:0">${initials}</div><div style="flex:1;min-width:0"><div class="user-mini mb-1">${escapeHtml(cw(p.author_name||'Student'))} · <span class="badge">${escapeHtml(subjName)}</span> · ${timeAgo(p.created_at)}</div><h3 style="font-size:15px;font-weight:700;margin-bottom:6px">${escapeHtml(cw(p.title))}</h3>${p.body?`<p class="text-sm text-muted mb-2" style="white-space:pre-wrap">${escapeHtml(cw(p.body))}</p>`:''}${tagHtml?`<div class="mb-1">${tagHtml}</div>`:''}${footer}${repliesHtml}</div></div></div>`;

async function submitNewPost(){
  const d=state.npDraft;const msg=document.getElementById('npMsg'),btn=document.getElementById('npSave');
  const fail=t=>{if(msg){msg.style.color='#FF6B6B';msg.textContent=t}if(btn)btn.disabled=false};
  if(!d||!d.title||!d.title.trim())return fail('Please add a title');
  let tag_type=null,tag_ref=null,tag_label=null;
  if(d.tagType==='paper'&&d.tagRef){const p=PAST_PAPERS.find(x=>x.code===d.tagRef);tag_type='paper';tag_ref=d.tagRef;tag_label=p?`${p.code} · ${p.season} ${p.year}`:d.tagRef}
  else if(d.tagType==='question'&&d.tagRef){const q=(state.topicalQuestions||[]).find(x=>String(x.id)===String(d.tagRef));tag_type='question';tag_ref=String(d.tagRef);tag_label=q?`${q.chapter||'?'} · ${q.year||''} (Paper ${q.paper||'?'})`:'Topical question'}
  const ct=censorText(d.title.trim());const cb=censorText((d.body||'').trim());const flagged=ct.found||cb.found;
  if(msg){msg.style.color='var(--text-muted)';msg.textContent='Posting...'}if(btn)btn.disabled=true;
  try{const {error}=await window.supabase.from('community_posts').insert({subject:d.subject,author_name:cw(state.user.name),title:ct.clean,body:cb.clean,tag_type,tag_ref,tag_label});if(error)return fail('Error: '+error.message);await loadCommunityPosts();closeModal();state.communitySubject='all';render();toast(flagged?'⚠️ Posted — we filtered some words to keep it clean':'Posted ✓',flagged?4000:2500)}catch(e){fail('Something went wrong')}
}

function renderEditProfileModal(){const nm=(state.user.name||'').replace(/"/g,'&quot;');const un=(state.user.username||'').replace(/"/g,'&quot;');return `<div class="modal fade-in" onclick="event.stopPropagation()"><div class="flex items-center justify-between mb-4"><h2 style="font-size:22px;font-weight:800">Edit profile</h2><button class="btn-icon btn" onclick="closeModal()">✕</button></div><div style="margin-bottom:14px"><label class="label">Full name</label><input id="epName" class="input" value="${nm}" placeholder="Salar Khan"></div><div style="margin-bottom:4px"><label class="label">Username</label><div style="display:flex;align-items:center;gap:6px"><span class="text-muted font-med">@</span><input id="epUser" class="input" value="${un}" placeholder="salar_khan" style="flex:1"></div><p class="text-xs text-muted mt-2">Lowercase letters, numbers and underscores. Must be unique.</p></div><div id="epMsg" class="text-sm" style="min-height:18px;margin:6px 0"></div><button id="epSave" class="btn btn-primary w-full btn-lg" onclick="saveProfile()">Save changes</button></div>`}
async function saveProfile(){
  const nameEl=document.getElementById('epName'),userEl=document.getElementById('epUser'),msg=document.getElementById('epMsg'),btn=document.getElementById('epSave');
  const name=(nameEl.value||'').trim();
  const username=(userEl.value||'').trim().toLowerCase().replace(/[^a-z0-9_]/g,'_').replace(/_+/g,'_').replace(/^_+|_+$/g,'');
  const fail=t=>{msg.style.color='#FF6B6B';msg.textContent=t};
  if(!name)return fail('Please enter your name');
  if(username.length<3)return fail('Username must be at least 3 characters');
  msg.style.color='var(--text-muted)';msg.textContent='Saving…';if(btn)btn.disabled=true;
  try{
    const {data:{user}}=await window.supabase.auth.getUser();
    if(!user){if(btn)btn.disabled=false;return fail('Not signed in')}
    const {data:taken}=await window.supabase.from('profiles').select('id').eq('username',username).neq('id',user.id).maybeSingle();
    if(taken){if(btn)btn.disabled=false;return fail('That username is already taken')}
    const {error}=await window.supabase.from('profiles').upsert({id:user.id,name,username,updated_at:new Date().toISOString()});
    if(error){if(btn)btn.disabled=false;return fail(error.code==='23505'?'That username is already taken':'Error: '+error.message)}
    try{await window.supabase.auth.updateUser({data:{full_name:name}})}catch(e){}
    state.user.name=name;state.user.username=username;
    closeModal();render();toast('Profile updated ✓');
  }catch(e){if(btn)btn.disabled=false;fail('Something went wrong — try again')}
}
function renderProfile(){return`${renderSidebar()}<div class="main-content"><div class="page-header"><h1 style="font-size:26px;font-weight:800;padding-bottom:20px">My Profile</h1></div><div class="page-body"><div class="profile-header mb-4"><div style="position:relative;cursor:pointer" onclick="pickAvatar()" title="Change profile photo">${avatarHTML('avatar-lg')}<div style="position:absolute;right:-2px;bottom:-2px;width:30px;height:30px;border-radius:50%;background:var(--sage);border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:14px">📷</div></div><input type="file" id="avatarInput" accept="image/*" onchange="onAvatarPick(event)" style="display:none">
<div style="flex:1"><h2 style="font-size:22px;font-weight:800">${state.user.name}</h2><p class="text-muted">@${state.user.username}</p><div class="flex gap-2 mt-2"><span class="badge">⭐ ${totalStars()} stars</span><span class="badge badge-mint">🔥 ${state.user.streak}-day streak</span><span class="badge">📄 ${Object.keys(state.trackerPapers).length} papers</span></div></div><button class="btn btn-secondary" onclick="editProfile()">✏ Edit Profile</button></div><div class="grid grid-2 gap-4"><div class="card"><h3 style="font-weight:800;margin-bottom:16px;font-size:16px">My Subscriptions</h3>${state.user.subjects.map(s=>{const sub=SUBJECTS[s];return`<div class="flex items-center justify-between mb-3 pb-3" style="border-bottom:1px solid var(--border)"><div class="flex items-center gap-3">${sub.emoji}<div><div class="font-semi text-sm">${sub.name}</div><div class="text-xs text-muted">${sub.code}</div></div></div><span class="badge badge-mint">Active</span></div>`;}).join('')}<button class="btn btn-ghost btn-sm w-full mt-2" onclick="navigate('pricing')">+ Upgrade to Bundle</button></div><div class="card"><h3 style="font-weight:800;margin-bottom:16px;font-size:16px">Subject Progress</h3>${state.user.subjects.map(s=>{const sub=SUBJECTS[s];const prog=state.user.progress[s]||0;return`<div class="mb-4"><div class="flex justify-between mb-1"><span class="font-med text-sm">${sub.emoji} ${sub.name}</span><span class="text-sm" style="color:var(--sage)">${prog}%</span></div><div class="progress-bar"><div class="progress-fill" style="width:${prog}%"></div></div></div>`;}).join('')}</div><div class="card"><h3 style="font-weight:800;margin-bottom:16px;font-size:16px">Stars & Achievements</h3><div class="grid grid-2 gap-3">${[{icon:'⭐',label:'Total Stars',val:totalStars()},{icon:'📄',label:'Papers Done',val:Object.keys(state.trackerPapers).length},{icon:'🔥',label:'Best Streak',val:(state.user.bestStreak||0)+' day'+((state.user.bestStreak||0)===1?'':'s')},{icon:'🏆',label:'Rank',val:state.user.rank?('#'+state.user.rank):'—'}].map(a=>`<div class="stat-card"><span class="num" style="font-size:22px">${a.icon}</span><span class="num" style="font-size:20px">${a.val}</span><div class="lbl">${a.label}</div></div>`).join('')}</div></div><div class="card"><h3 style="font-weight:800;margin-bottom:16px;font-size:16px">Saved Questions</h3><div class="empty-state"><div class="icon">🔖</div><p>No bookmarked questions yet</p><p class="text-xs mt-2">Bookmark questions from the generator to revisit them here</p></div></div></div></div></div>`}

function render(){const app=document.getElementById('app');ensureStudyDay();if(!state.loggedIn){switch(state.page){case 'pricing':app.innerHTML=renderPricing();break;default:app.innerHTML=renderLanding()}}else{switch(state.page){case 'dashboard':app.innerHTML=renderDashboard();break;case 'subject':app.innerHTML=renderSubject();break;case 'community':app.innerHTML=renderCommunityPage(false);break;case 'profile':app.innerHTML=renderProfile();break;case 'settings':app.innerHTML=renderSettings();break;case 'topical':app.innerHTML=renderTopicalPage();break;case 'mcq':app.innerHTML=renderMcqPage();break;case 'leaderboard':app.innerHTML=renderLeaderboardPage();break;default:app.innerHTML=renderDashboard()}}document.getElementById('report-fab')?.classList.toggle('hidden',!state.loggedIn);document.getElementById('app').classList.toggle('sb-collapsed',state.sidebarCollapsed);document.getElementById('sbOpen')?.classList.toggle('hidden',!state.sidebarCollapsed);document.getElementById('sbBackdrop')?.classList.toggle('show',state.loggedIn&&!state.sidebarCollapsed&&window.matchMedia('(max-width:768px)').matches);saveNav();saveTimer()}

async function initAuth()
  {while(!window.supabase){await new Promise(r=>setTimeout(r,50))}
  const {data:{session}}=await window.supabase.auth.getSession();
  if(session){resetUserState(session.user.user_metadata?.full_name||session.user.email,session.user.user_metadata?.avatar);state.userId=session.user.id;await loadUserScores();await loadTopicalAttempts();await loadProfile();await loadCommunityPosts();await loadProgress();state.loggedIn=true;loadNavInto()}
  await loadTopicalQuestions();
  await loadMcqQuestions();
  await loadStudentCount();
  if(state.loggedIn)await refreshRank();
  render();
  window.supabase.auth.onAuthStateChange((event,session)=>{
    if(event==='SIGNED_OUT'){state.loggedIn=false;render()}
  });
}
loadTheme();loadStudy();loadTimer();loadGoals();loadExamDates();if(window.matchMedia('(max-width:768px)').matches)state.sidebarCollapsed=true;initAuth();
</script>
</body>
</html>
